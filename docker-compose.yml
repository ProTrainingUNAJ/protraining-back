name: protraining

# Cada servicio tiene su propia base. Ningún servicio usa la base de otro.

x-db: &db
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en el .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}

x-api: &api
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

x-api-env: &api-env
  # Por defecto Production: Development (Swagger y cuentas de demo) solo si el .env lo pide.
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  Database__Port: "5432"
  Database__User: ${POSTGRES_USER}
  Database__Password: ${POSTGRES_PASSWORD}
  Jwt__Key: ${JWT_KEY:?Falta JWT_KEY en el .env}
  Jwt__Issuer: ${JWT_ISSUER:?Falta JWT_ISSUER en el .env}
  Jwt__Audience: ${JWT_AUDIENCE:?Falta JWT_AUDIENCE en el .env}
  Cors__AllowedOrigins__0: http://localhost:5173
  Cors__AllowedOrigins__1: http://localhost:3000

services:
  # ---------- Bases ----------
  db-identidad:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: identidad
    ports: ["5433:5432"]
    volumes: [db-identidad:/var/lib/postgresql/data]

  db-estructura:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: estructura
    ports: ["5434:5432"]
    volumes: [db-estructura:/var/lib/postgresql/data]

  db-entrenamiento:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: entrenamiento
    ports: ["5435:5432"]
    volumes: [db-entrenamiento:/var/lib/postgresql/data]

  db-seguimiento:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: seguimiento
    ports: ["5436:5432"]
    volumes: [db-seguimiento:/var/lib/postgresql/data]

  db-asistente:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: asistente
    ports: ["5437:5432"]
    volumes: [db-asistente:/var/lib/postgresql/data]

  # ---------- Servicios ----------
  identidad:
    <<: *api
    build: services/identidad
    environment:
      <<: *api-env
      Database__Host: db-identidad
      Database__Name: identidad
    ports: ["8081:8080"]
    depends_on:
      db-identidad: { condition: service_healthy }

  estructura:
    <<: *api
    build: services/estructura
    environment:
      <<: *api-env
      Database__Host: db-estructura
      Database__Name: estructura
      Vapid__Subject: ${VAPID_SUBJECT:-mailto:soporte@protraining.app}
      Vapid__PublicKey: ${VAPID_PUBLIC_KEY:-}
      Vapid__PrivateKey: ${VAPID_PRIVATE_KEY:-}
    ports: ["8082:8080"]
    depends_on:
      db-estructura: { condition: service_healthy }

  entrenamiento:
    <<: *api
    build: services/entrenamiento
    environment:
      <<: *api-env
      Database__Host: db-entrenamiento
      Database__Name: entrenamiento
      Services__Estructura__BaseUrl: http://estructura:8080
    ports: ["8083:8080"]
    depends_on:
      db-entrenamiento: { condition: service_healthy }

  seguimiento:
    <<: *api
    build: services/seguimiento
    environment:
      <<: *api-env
      Database__Host: db-seguimiento
      Database__Name: seguimiento
      Services__Estructura__BaseUrl: http://estructura:8080
    ports: ["8084:8080"]
    depends_on:
      db-seguimiento: { condition: service_healthy }

  asistente:
    <<: *api
    build: services/asistente
    environment:
      <<: *api-env
      Database__Host: db-asistente
      Database__Name: asistente
      Services__Entrenamiento__BaseUrl: http://entrenamiento:8080
      Ollama__BaseUrl: http://ollama:11434
      Ollama__Model: ${OLLAMA_MODEL:-llama3.2:1b}
      Ollama__TimeoutSeconds: ${OLLAMA_TIMEOUT_SECONDS:-15}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
    ports: ["8085:8080"]
    depends_on:
      db-asistente: { condition: service_healthy }

  # ---------- Modelo local de IA (opcional: docker compose --profile ia up) ----------
  # Sólo lo levanta quien trabaja con IA. El Asistente no depende de Ollama para arrancar,
  # y el CI no lo levanta (así no descarga la imagen ni el modelo en cada PR).
  ollama:
    profiles: [ia]
    image: ollama/ollama:0.40.3
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ollama-model:
    profiles: [ia]
    image: ollama/ollama:0.40.3
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:1b}"]
    restart: "no"

  # ---------- Gateway ----------
  # Única entrada para el front: /identidad, /estructura, /entrenamiento, /seguimiento, /asistente.
  # No depende de los servicios: si uno está caído, sólo falla su ruta.
  gateway:
    <<: *api
    build: gateway
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:3000
    ports: ["8000:8080"]

  # ---------- Front (opcional: docker compose --profile front up) ----------
  front:
    profiles: [front]
    build: ../protraining-front
    restart: unless-stopped
    ports: ["3000:80"]

volumes:
  db-identidad:
  db-estructura:
  db-entrenamiento:
  db-seguimiento:
  db-asistente:
  ollama:
