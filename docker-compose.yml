name: protraining

# Cada servicio tiene su propia base. Ningún servicio usa la base de otro.

x-db: &db
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en el .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}

x-api: &api
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

x-api-env: &api-env
  # Por defecto Production: Development (Swagger y cuentas de demo) solo si el .env lo pide.
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  Database__Port: "5432"
  Database__User: ${POSTGRES_USER}
  Database__Password: ${POSTGRES_PASSWORD}
  Jwt__Key: ${JWT_KEY:?Falta JWT_KEY en el .env}
  Jwt__Issuer: ${JWT_ISSUER:?Falta JWT_ISSUER en el .env}
  Jwt__Audience: ${JWT_AUDIENCE:?Falta JWT_AUDIENCE en el .env}
  Cors__AllowedOrigins__0: http://localhost:5173
  Cors__AllowedOrigins__1: http://localhost:3000

services:
  # ---------- Bases ----------
  db-identidad:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: identidad
    ports: ["5433:5432"]
    volumes: [db-identidad:/var/lib/postgresql/data]

  db-estructura:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: estructura
    ports: ["5434:5432"]
    volumes: [db-estructura:/var/lib/postgresql/data]

  db-entrenamiento:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: entrenamiento
    ports: ["5435:5432"]
    volumes: [db-entrenamiento:/var/lib/postgresql/data]

  db-seguimiento:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: seguimiento
    ports: ["5436:5432"]
    volumes: [db-seguimiento:/var/lib/postgresql/data]

  db-asistente:
    <<: *db
    environment:
      <<: *db-env
      POSTGRES_DB: asistente
    ports: ["5437:5432"]
    volumes: [db-asistente:/var/lib/postgresql/data]

  # ---------- Servicios ----------
  identidad:
    <<: *api
    build: services/identidad
    environment:
      <<: *api-env
      Database__Host: db-identidad
      Database__Name: identidad
      Services__Estructura__BaseUrl: http://estructura:8080
      Services__Seguimiento__BaseUrl: http://seguimiento:8080
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-soporte.pro.training@gmail.com}
      Smtp__Password: ${SMTP_PASSWORD:-vsjdervhzibcfcag}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-soporte.pro.training@gmail.com}
      Smtp__FromName: ${SMTP_FROM_NAME:-ProTraining}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://127.0.0.1:5173/}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
    ports: ["8081:8080"]
    depends_on:
      db-identidad: { condition: service_healthy }

  estructura:
    <<: *api
    build: services/estructura
    environment:
      <<: *api-env
      Database__Host: db-estructura
      Database__Name: estructura
      Vapid__Subject: ${VAPID_SUBJECT:-mailto:soporte@protraining.app}
      Vapid__PublicKey: ${VAPID_PUBLIC_KEY:-}
      Vapid__PrivateKey: ${VAPID_PRIVATE_KEY:-}
    ports: ["8082:8080"]
    depends_on:
      db-estructura: { condition: service_healthy }

  entrenamiento:
    <<: *api
    build: services/entrenamiento
    environment:
      <<: *api-env
      Database__Host: db-entrenamiento
      Database__Name: entrenamiento
      Services__Estructura__BaseUrl: http://estructura:8080
      Services__Seguimiento__BaseUrl: http://seguimiento:8080
    ports: ["8083:8080"]
    depends_on:
      db-entrenamiento: { condition: service_healthy }

  seguimiento:
    <<: *api
    build: services/seguimiento
    environment:
      <<: *api-env
      Database__Host: db-seguimiento
      Database__Name: seguimiento
      Services__Estructura__BaseUrl: http://estructura:8080
      Services__Entrenamiento__BaseUrl: http://entrenamiento:8080
      Services__Seguimiento__BaseUrl: http://seguimiento:8080
    ports: ["8084:8080"]
    depends_on:
      db-seguimiento: { condition: service_healthy }

  asistente:
    <<: *api
    build: services/asistente
    environment:
      <<: *api-env
      Database__Host: db-asistente
      Database__Name: asistente
      Services__Entrenamiento__BaseUrl: http://entrenamiento:8080
      Services__Estructura__BaseUrl: http://estructura:8080
      Services__Seguimiento__BaseUrl: http://seguimiento:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      Ai__Agent__Providers__0__Name: OpenAI
      Ai__Agent__Providers__0__BaseUrl: ${OPENAI_BASE_URL:-https://rs-ai-gateway-unaj.azure-api.net/unaj-llm/openai/deployments/gpt-4.1-mini/?api-version=2025-03-01-preview}
      Ai__Agent__Providers__0__Model: ${OPENAI_MODEL:-gpt-4.1-mini}
      Ai__Agent__Providers__0__ApiKey: ${OPENAI_API_KEY:-}
      Ai__Agent__Providers__1__Name: Gemini
      Ai__Agent__Providers__1__BaseUrl: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      Ai__Agent__Providers__1__Model: ${GEMINI_MODEL:-gemini-3.8-flash}
      Ai__Agent__Providers__1__ApiKey: ${GEMINI_API_KEY:-}
      Worker__DailyOverloadAnalysis__Hour: 0
    ports: ["8085:8080"]
    depends_on:
      db-asistente: { condition: service_healthy }

  # ---------- Correo de desarrollo y demo (Mailpit) ----------
  mailpit:
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

  # ---------- Gateway ----------
  # Única entrada para el front: /identidad, /estructura, /entrenamiento, /seguimiento, /asistente.
  # No depende de los servicios: si uno está caído, sólo falla su ruta.
  gateway:
    <<: *api
    build: gateway
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:3000
      Jwt__Key: ${JWT_KEY:?Falta JWT_KEY en el .env}
      Jwt__Issuer: ${JWT_ISSUER:?Falta JWT_ISSUER en el .env}
      Jwt__Audience: ${JWT_AUDIENCE:?Falta JWT_AUDIENCE en el .env}
      Services__Identidad__BaseUrl: http://identidad:8080
    ports: ["8000:8080"]

  # ---------- Front (opcional: docker compose --profile front up) ----------
  front:
    profiles: [front]
    build: ../protraining-front
    restart: unless-stopped
    ports: ["3000:80"]

volumes:
  db-identidad:
  db-estructura:
  db-entrenamiento:
  db-seguimiento:
  db-asistente:
