openapi: 3.0.3
info:
  title: ProTraining - Microservicio de Asistente IA
  description: >
    API v1 para el copiloto inteligente del preparador físico. Funciona bajo un esquema
    híbrido y resiliente: agente de IA compatible con la API de OpenAI (OpenAI y Gemini, en ese
    orden y según las claves configuradas) y reglas determinísticas locales como respaldo final.
    Genera alertas preventivas de fatiga/lesión, propone ajustes del día por molestias marcadas
    en el check-in, sugiere rutinas estructuradas y redacta recomendaciones de hábitos y alimentación
    sujetas a aprobación humana explícita del preparador físico en un solo clic.
  version: 1.2.0
servers:
  - url: http://localhost:8085
    description: Entorno local / Docker Compose
  - url: http://asistente:8080
    description: Red interna de Docker entre microservicios

security:
  - BearerAuth: []

tags:
  - name: Preventive Alerts
    description: Detección proactiva de fatiga, sobrecarga y riesgo lesional
  - name: Daily Adjustment
    description: Adaptaciones inmediatas de la sesión cuando el atleta marca dolor en el check-in
  - name: Copilot and Planning
    description: Generación estructurada de propuestas de entrenamiento y descarga con IA
  - name: Habits and Nutrition
    description: Recomendaciones de descanso, hidratación y pautas alimentarias aprobadas por el PF
  - name: Recommendations
    description: Motor de recomendaciones de entrenamiento generadas por perfil frente al grupo y tendencias
  - name: Health
    description: Monitoreo de disponibilidad del servicio y base de datos

paths:
  /api/v1/alerts:
    get:
      tags:
        - Preventive Alerts
      summary: Listar alertas preventivas generadas
      description: Devuelve las alertas calculadas por el motor analítico, permitiendo filtrar por estado de revisión o severidad.
      operationId: listAlerts
      parameters:
        - name: onlyUnreviewed
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Si es true, retorna únicamente las alertas pendientes de acción por el PF.
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [Low, Medium, High]
          description: Filtrar por severidad de la alerta.
      responses:
        "200":
          description: Lista de alertas preventivas recuperadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreventiveAlert'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Preventive Alerts
      summary: Crear un aviso preventivo
      description: >
        Crea y persiste un aviso preventivo para un atleta perteneciente al preparador físico autenticado.
        El identificador pf_id se obtiene exclusivamente del token JWT autenticado y athleteId se valida
        contra Estructura antes de persistir. Requiere rol PreparadorFisico.
      operationId: createAlert
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreventiveAlertRequest'
      responses:
        "201":
          description: Aviso preventivo creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreventiveAlert'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/alerts/{id}:
    get:
      tags:
        - Preventive Alerts
      summary: Obtener detalle de un aviso preventivo por ID
      description: >
        Devuelve el detalle de un aviso preventivo perteneciente al preparador físico autenticado.
        Retorna 404 si el aviso no existe o pertenece a otro PF (aislamiento multi-tenant).
      operationId: getAlertById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único del aviso preventivo.
      responses:
        "200":
          description: Aviso preventivo recuperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreventiveAlert'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/alerts/{alertId}/review:
    patch:
      tags:
        - Preventive Alerts
      summary: Marcar alerta preventiva como revisada
      description: Registra la intervención del preparador físico sobre la recomendación generada.
      operationId: reviewAlert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Alerta actualizada como revisada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Alerta marcada como revisada exitosamente."
                  alertId:
                    type: string
                    format: uuid
                    example: "8e41bf39-3f04-4b95-a112-9c3f0c13bb10"
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/alerts/{alertId}/apply:
    post:
      tags:
        - Preventive Alerts
      summary: Aplicar ajuste de aviso preventivo en un clic
      description: >
        Aplica la modificación sugerida por el aviso preventivo directamente en Entrenamiento
        generando la variante de sesión para el atleta (#183 · KAN-478).
        Requiere rol PreparadorFisico.
      operationId: applyAlertAdjustment
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ajuste aplicado exitosamente en Entrenamiento y aviso marcado como aplicado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Ajuste preventivo aplicado exitosamente en Entrenamiento."
                  alertId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: "Applied"
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/assistant/today-adjustment:
    post:
      tags:
        - Daily Adjustment
      summary: Proponer adaptación de la rutina de hoy ante reporte de dolor
      description: >
        Cruza la rutina planificada para hoy con el dolor o molestia reportado en el check-in.
        Si hay conflicto articular o muscular, sugiere sustituir o reducir ejercicios (ej. retirar saltos por dolor de rodilla).
        El PF valida y aprueba la adaptación en un solo clic.
      operationId: suggestTodayAdjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodayAdjustmentRequest'
      responses:
        "200":
          description: Propuesta de ajuste generada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayAdjustmentResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/assistant/suggest-routine:
    post:
      tags:
        - Copilot and Planning
      summary: Generar propuesta estructurada de rutina con IA
      description: >
        Solicita al copiloto IA una recomendación de entrenamiento adaptada a un atleta o categoría,
        tomando en cuenta sus récords vigentes, check-ins recientes y antecedentes de lesión.
      operationId: suggestRoutineWithAi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestRoutineRequest'
      responses:
        "200":
          description: Propuesta de rutina generada en formato estructurado JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestRoutineResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/assistant/plan-drafts:
    post:
      tags:
        - Copilot and Planning
      summary: Generar y persistir un nuevo borrador de planificación con IA
      description: >
        Genera un borrador de planificación multisesión a través de la cadena resiliente de IA
        (OpenAI -> Gemini -> Reglas), validando esquema e identificadores del catálogo oficial y
        persistiéndolo en la base de datos bajo aislamiento multi-tenant.
      operationId: createPlanDraftWithAi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanDraftRequest'
      responses:
        "201":
          description: Borrador de planificación generado y persistido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assistant/plan-drafts/{id}:
    get:
      tags:
        - Copilot and Planning
      summary: Obtener un borrador de planificación por su identificador
      description: Devuelve el borrador generado por la IA siempre que pertenezca al preparador físico autenticado.
      operationId: getPlanDraftById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Borrador de planificación recuperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Copilot and Planning
      summary: Editar y reemplazar el contenido de un borrador de planificación
      description: >
        Permite al preparador físico modificar cualquier parte del borrador en estado Draft.
        Ejecuta validaciones de esquema, existencia en el catálogo oficial, rangos deportivos y topes
        pre-partido, guardando además las sustituciones o eliminaciones de ejercicios en la memoria del PF.
      operationId: updatePlanDraft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanDraftRequest'
      responses:
        "200":
          description: Borrador actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/assistant/plan-drafts/{id}/approve:
    post:
      tags:
        - Copilot and Planning
      summary: Aprobar borrador de planificación y crearlo en Entrenamiento
      description: >
        Transforma el borrador aprobado en un SaveTrainingPlanRequest, lo crea en el microservicio de
        Entrenamiento reenviando el token del preparador físico y lo asigna a la categoría o atleta con la
        fecha de inicio configurada. Si el borrador ya estaba aprobado, devuelve el planId existente sin
        duplicar la planificación.
      operationId: approvePlanDraft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Borrador aprobado y planificación creada en Entrenamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovePlanDraftResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assistant/plan-drafts/{id}/discard:
    post:
      tags:
        - Copilot and Planning
      summary: Descartar un borrador de planificación generado por la IA
      description: Pasa el borrador al estado Discarded impidiendo futuras ediciones o aprobaciones.
      operationId: discardPlanDraft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Borrador descartado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/assistant/athletes/{athleteId}/day-conflicts:
    get:
      tags:
        - Daily Adjustment
      summary: Detectar dolor del check-in en zonas que trabaja la rutina de hoy
      description: >
        Cruza el dolor reportado hoy en el check-in del atleta (Seguimiento) con los ejercicios de
        la rutina que le toca hoy (Entrenamiento) y consulta la matriz de restricciones anatómicas
        para devolver los ejercicios en conflicto junto con sus sustitutos seguros. Si el atleta
        todavía no completó el check-in de hoy, responde 200 con hasConflicts en false y el aviso
        "Todavía no hizo el check-in". Si el atleta no existe o pertenece a otro PF, responde 404.
        Si Seguimiento o Entrenamiento no están disponibles, responde 503 sin inventar conflictos.
      operationId: getAthleteDayConflicts
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único del atleta.
      responses:
        "200":
          description: Cruce de dolor del check-in con la rutina de hoy evaluado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayConflictsResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assistant/categories/{categoryId}/day-conflicts:
    get:
      tags:
        - Daily Adjustment
      summary: Detectar qué atletas de una categoría tienen conflictos entre el dolor de hoy y su rutina
      description: >
        Evalúa en una sola llamada por categoría cuáles atletas reportaron dolor en su check-in de hoy
        en zonas que trabaja su rutina de hoy, evitando el patrón N+1 desde la pantalla del semáforo (KAN-574).
        Solo evalúa rutinas y restricciones para los atletas que registraron zonas de dolor hoy.
        Si la categoría no existe o pertenece a otro PF, responde 404.
        Si Seguimiento o Entrenamiento no están disponibles, responde 503 sin inventar conflictos.
      operationId: getCategoryDayConflicts
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único de la categoría.
      responses:
        "200":
          description: Estado de conflictos del día por atleta de la categoría obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDayConflictsResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assistant/athletes/{athleteId}/day-adjustments:
    post:
      tags:
        - Daily Adjustment
      summary: Generar propuesta de ajuste del día a partir de los conflictos de hoy
      description: >
        Genera y persiste la propuesta de ajuste del día (`day_adjustments`) a partir de los conflictos
        de dolor de hoy (KAN-451). El ejercicio sustituto se elige por reglas (el primero de la lista de
        sustitutos habilitados de KAN-387) y la IA solo redacta la justificación (con respaldo por reglas
        si los proveedores de IA fallan o no tienen clave). Si ya existe una propuesta `Pending` para hoy, devuelve
        esa sin duplicarla.
      operationId: createAthleteDayAdjustment
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único del atleta.
      responses:
        "200":
          description: Propuesta de ajuste del día generada o recuperada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayAdjustmentResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assistant/day-adjustments/{id}/approve:
    post:
      tags:
        - Daily Adjustment
      summary: Aprobar propuesta de ajuste del día y aplicarla en Entrenamiento
      description: >
        Aprueba la propuesta de ajuste del día (permitiendo cambiar el sustituto por otro de la lista
        de sustitutos habilitados de KAN-387), llama a Entrenamiento para aplicar el ajuste en la sesión
        del atleta y guarda la decisión en la memoria del PF (`pf_decisions`) dentro de la misma transacción.
      operationId: approveDayAdjustment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de la propuesta de ajuste del día.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveDayAdjustmentRequest'
      responses:
        "200":
          description: Propuesta aprobada y aplicada en la rutina del atleta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayAdjustmentResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assistant/day-adjustments/{id}/reject:
    post:
      tags:
        - Daily Adjustment
      summary: Rechazar propuesta de ajuste del día
      description: >
        Rechaza la propuesta dejando la sesión sin cambios y registra la decisión en la memoria del PF
        (`pf_decisions`) dentro de la misma transacción.
      operationId: rejectDayAdjustment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de la propuesta de ajuste del día.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDayAdjustmentRequest'
      responses:
        "200":
          description: Propuesta rechazada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayAdjustmentResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/assistant/athletes/{athleteId}/adaptation:
    post:
      tags:
        - Copilot and Planning
      summary: Generar rutina contextualizada con adaptación individual
      description: >
        Genera una propuesta de rutina para el atleta incorporando su contexto de adaptación
        (lesiones activas, récords vigentes y sustitutos autorizados), validando ownership del PF.
      operationId: generateAthleteAdaptation
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único del atleta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAthleteAdaptationRequest'
      responses:
        "200":
          description: Propuesta de rutina adaptada generada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineAdaptationResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assistant/athletes/{athleteId}/adaptation-context:
    get:
      tags:
        - Copilot and Planning
      summary: Obtener contexto de adaptación individual del atleta
      description: >
        Reúne lesiones activas, récords vigentes y restricciones con sustitutos autorizados para
        preparar una adaptación individual, validando ownership del PF.
      operationId: getAthleteAdaptationContext
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único del atleta.
      responses:
        "200":
          description: Contexto de adaptación recuperado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteAdaptationContextResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assistant/athletes/{athleteId}/decisions:
    get:
      tags:
        - Copilot and Planning
      summary: Consultar decisiones históricas del PF sobre propuestas del asistente
      description: >
        Devuelve el historial reciente de decisiones (aprobaciones, cambios o rechazos) tomadas por el preparador físico
        autenticado sobre ejercicios sugeridos para el atleta especificado, con filtro opcional por zona anatómica y limitado
        a las últimas 50 decisiones. Responde 404 si el atleta no existe o no pertenece al preparador físico.
      operationId: getAthleteDecisions
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único del atleta.
        - name: zone
          in: query
          required: false
          schema:
            type: string
          description: Filtro opcional por zona anatómica o de molestia (ej. espalda_baja).
      responses:
        "200":
          description: Lista de decisiones recuperadas (hasta 50).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PfDecisionResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/habits-recommendation:
    get:
      tags:
        - Habits and Nutrition
      summary: Obtener recomendación de hábitos y nutrición según objetivo
      description: >
        Genera consejos de descanso, hidratación y requerimiento proteico diario según el peso y objetivo del atleta
        (basado en reglas fijas; sin suplementos; si el atleta es menor requiere consentimiento del tutor).
        KAN-494: el rango cuantitativo de proteína sólo se calcula cuando la fuente de contexto informa peso y
        objetivo válidos y la ficha médica auditada de Estructura puede verificarse sin riesgos registrados.
        Si faltan peso/objetivo, la ficha está vacía, incompleta o no se puede consultar, la respuesta es
        cualitativa o con derivación profesional, con minProteinGrams/maxProteinGrams en null; nunca se inventan
        valores. Fuente de peso/objetivo: el perfil físico canónico de Estructura
        (PATCH /api/v1/athletes/{id}/physical-profile y PATCH /api/v1/me/physical-profile, vocabulario cerrado
        "Ganar masa muscular" / "Mantener" / "Rendimiento deportivo" / "Objetivo no informado"). Si el dato no
        existe o Estructura no responde, el proveedor devuelve "sin dato" y no se inventan valores. Sigue sin
        haber definición aprobada de "día pesado" (se reporta en missingData). Ambas dependencias tienen un
        proveedor desacoplado. Los umbrales de partido cercano
        (2 días) y poco descanso (menos de 6 h) están alineados con reglas ya implementadas (KAN-473/KAN-477) y
        no se modifican sin validación profesional. La ficha médica se clasifica en backend; si Estructura pasa a
        exponer alergias/condiciones estructuradas se consumen automáticamente, y un false nunca borra un riesgo
        detectado en el texto libre. La consulta requiere consentimiento y se audita en Estructura.
        Devuelve 409 cuando la preferencia del PF o la autorización del tutor no habilitan hábitos (KAN-493/496).
      operationId: getHabitsRecommendation
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recomendación generada lista para validación del PF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitsRecommendationResponse'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/habits-recommendations/{recommendationId}/approve:
    patch:
      tags:
        - Habits and Nutrition
      summary: Aprobar recomendación de hábitos por el preparador físico
      description: El PF autoriza con un solo clic que la recomendación sea visible para el atleta en su PWA.
      operationId: approveHabitsRecommendation
      parameters:
        - name: recommendationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recomendación aprobada y publicada para el atleta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Recomendación de hábitos aprobada y visible para el atleta."
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/recommendations:
    post:
      tags:
        - Recommendations
      summary: Ejecutar el motor de recomendaciones para un atleta
      description: >
        Recopila los tests físicos del atleta, los promedios de su categoría y sus tendencias semanales,
        calcula brechas y motivos por reglas determinísticas, redacta la recomendación con IA sin datos personales
        y la persiste en estado Pending para revisión del preparador físico (#196 · KAN-491).
      operationId: generateAthleteRecommendations
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único del atleta.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAthleteRecommendationsRequest'
      responses:
        "201":
          description: Motor ejecutado con nuevas recomendaciones pendientes generadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAthleteRecommendationEngineResponse'
        "200":
          description: Motor ejecutado sin nuevas recomendaciones generadas (sin brechas o ya pendientes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAthleteRecommendationEngineResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/categories/{categoryId}/recommendations:
    post:
      tags:
        - Recommendations
      summary: Ejecutar el motor de recomendaciones para una categoría
      description: >
        Evalúa a todos los atletas activos de la categoría frente al promedio grupal y sus tendencias semanales,
        redactando y guardando recomendaciones pendientes de aprobación del PF (#196 · KAN-491).
      operationId: generateCategoryRecommendations
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único de la categoría.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCategoryRecommendationsRequest'
      responses:
        "201":
          description: Motor ejecutado con nuevas recomendaciones pendientes generadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCategoryRecommendationEngineResponse'
        "200":
          description: Motor ejecutado sin nuevas recomendaciones generadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCategoryRecommendationEngineResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/recommendations:
    get:
      tags:
        - Recommendations
      summary: Listar recomendaciones del preparador físico
      description: Devuelve las recomendaciones del PF actual filtradas opcionalmente por atleta, categoría o estado (#196 · KAN-491).
      operationId: listRecommendations
      parameters:
        - name: athleteId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtro opcional por identificador de atleta.
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtro opcional por identificador de categoría.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Approved, Discarded]
          description: Filtro opcional por estado de revisión.
      responses:
        "200":
          description: Lista de recomendaciones recuperadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AthleteRecommendation'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/recommendations/{id}:
    get:
      tags:
        - Recommendations
      summary: Obtener detalle de una recomendación
      description: Devuelve el detalle de una recomendación del PF actual por su identificador (#196 · KAN-491).
      operationId: getRecommendationById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único de la recomendación.
      responses:
        "200":
          description: Recomendación encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteRecommendation'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Recommendations
      summary: Editar título y texto de una recomendación pendiente
      description: >
        Permite al preparador físico editar el título y el texto de una recomendación mientras se
        encuentre en estado Pending (#197 · KAN-492). El motivo objetivo (reason) permanece inmutable.
      operationId: updateRecommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único de la recomendación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecommendationRequest'
      responses:
        "200":
          description: Recomendación actualizada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteRecommendation'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/recommendations/{id}/approve:
    post:
      tags:
        - Recommendations
      summary: Aprobar una recomendación pendiente y enviarla al atleta
      description: >
        Aprueba una recomendación en estado Pending (opcionalmente aplicando cambios de título o texto
        en el mismo paso) para que quede visible en la app del atleta (#197 · KAN-492).
      operationId: approveRecommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único de la recomendación.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRecommendationRequest'
      responses:
        "200":
          description: Recomendación aprobada y visible para el atleta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteRecommendation'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/recommendations/{id}/discard:
    post:
      tags:
        - Recommendations
      summary: Descartar una recomendación pendiente
      description: >
        Marca una recomendación en estado Pending como Discarded para archivarla sin mostrarla
        nunca al atleta (#197 · KAN-492).
      operationId: discardRecommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único de la recomendación.
      responses:
        "200":
          description: Recomendación descartada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteRecommendation'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/me/recommendations:
    get:
      tags:
        - Recommendations
      summary: Listar recomendaciones aprobadas del atleta autenticado
      description: >
        Devuelve únicamente las recomendaciones aprobadas por el preparador físico para el atleta
        autenticado (#197 · KAN-492). Resuelve la identidad del atleta desde Estructura GET /api/v1/me.
      operationId: listMyRecommendations
      responses:
        "200":
          description: Lista de recomendaciones aprobadas del atleta ordenadas por fecha de aprobación descendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyRecommendation'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/health:
    get:
      tags:
        - Health
      summary: Chequeo de salud del servicio
      security: []
      operationId: healthCheck
      responses:
        "200":
          description: Servicio saludable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Healthy"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: No autenticado o credenciales inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Acceso denegado para el rol actual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Recurso o alerta no encontrada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: El microservicio dependiente no está disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    PreventiveAlert:
      type: object
      required:
        - id
        - athleteId
        - athleteName
        - generatedAt
        - severity
        - reason
        - suggestion
        - reviewed
      properties:
        id:
          type: string
          format: uuid
          example: "8e41bf39-3f04-4b95-a112-9c3f0c13bb10"
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        athleteName:
          type: string
          example: "Lucas Fernández"
        generatedAt:
          type: string
          format: date-time
          example: "2026-10-10T08:00:00Z"
        severity:
          type: string
          enum: [Low, Medium, High]
          example: "High"
        reason:
          type: string
          example: "Sobrecarga acumulada: 3 sesiones consecutivas con esfuerzo >= 8 y registro de descanso menor a 5 horas."
        suggestion:
          type: string
          example: "Programar una sesión de descarga o movilidad pasiva. Reducir volumen general un 30%."
        reviewed:
          type: boolean
          example: false
        suggestedAdjustmentType:
          type: string
          nullable: true
          enum: [LoadReduction, RoutineAdjustment, Rest]
          example: "RoutineAdjustment"
        suggestedAdjustmentPercentage:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          example: 25
        status:
          type: string
          nullable: true
          enum: [Pending, Reviewed, Applied, Dismissed]
          example: "Pending"

    CreatePreventiveAlertRequest:
      type: object
      required:
        - athleteId
        - athleteName
        - reason
        - suggestion
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        athleteName:
          type: string
          minLength: 1
          maxLength: 200
          example: "Lucas Fernández"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Sobrecarga acumulada: 3 sesiones consecutivas con esfuerzo >= 8 y registro de descanso menor a 5 horas."
        suggestion:
          type: string
          minLength: 1
          maxLength: 1000
          example: "Programar una sesión de descarga o movilidad pasiva. Reducir volumen general un 30%."
        severity:
          type: string
          nullable: true
          enum: [Low, Medium, High]
          example: "High"
        type:
          type: string
          nullable: true
          enum: [AccumulatedFatigue, AcuteOverload, InjuryRisk, WellnessAlert]
          example: "AccumulatedFatigue"
        suggestedAdjustmentType:
          type: string
          nullable: true
          enum: [LoadReduction, RoutineAdjustment, Rest]
          example: "LoadReduction"
        suggestedAdjustmentPercentage:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          example: 25
        suggestedAdjustmentPayload:
          type: string
          nullable: true
          example: '{"loadReductionPercentage": 25}'
        categoryId:
          type: string
          format: uuid
          nullable: true
          example: "22222222-2222-2222-2222-222222222222"

    TodayAdjustmentRequest:
      type: object
      required:
        - athleteId
        - reportedPainZones
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        reportedPainZones:
          type: string
          example: "Rodilla derecha, tendón rotuliano"
        daysUntilNextMatch:
          type: integer
          nullable: true
          example: 3

    TodayAdjustmentResponse:
      type: object
      required:
        - requiresAdjustment
        - reason
        - adjustmentSuggestion
      properties:
        requiresAdjustment:
          type: boolean
          example: true
        reason:
          type: string
          example: "Conflicto entre molestia en rodilla derecha y ejercicios de impacto planificados para hoy."
        adjustmentSuggestion:
          type: string
          example: "Retirar los saltos al cajón y sustituir sentadilla pesada por prensa unilateral al 50% de 1RM."
        modifiedExercises:
          type: array
          items:
            type: object
            properties:
              originalExercise:
                type: string
                example: "Salto al cajón pliométrico"
              substituteExercise:
                type: string
                example: "Movilidad de tobillo y cadera sin carga"

    SuggestRoutineRequest:
      type: object
      required:
        - athleteId
        - goal
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        goal:
          type: string
          example: "Descarga activa y recuperación funcional"
        muscleGroupEmphasis:
          type: array
          items:
            type: string
          example: ["Movilidad de cadera", "Core"]

    SuggestRoutineResponse:
      type: object
      required:
        - athleteId
        - proposedTitle
        - justificationSummary
        - exercises
        - aiProvider
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        proposedTitle:
          type: string
          example: "Sesión de Descarga Adaptativa"
        justificationSummary:
          type: string
          example: "Se redujo el volumen un 40% debido a reportes recientes de fatiga alta (RPE 8) y descanso insuficiente."
        exercises:
          type: array
          items:
            type: object
            required:
              - exerciseName
              - sets
              - reps
              - suggestedPercentage
            properties:
              exerciseName:
                type: string
                example: "Sentadilla Goblet con mancuerna"
              sets:
                type: integer
                example: 3
              reps:
                type: integer
                example: 10
              suggestedPercentage:
                type: number
                example: 50.0
        aiProvider:
          type: string
          description: >
            Proveedor de IA o motor que originó la propuesta (por ejemplo `Agente (OpenAI)`,
            `Agente (Gemini)` o `Reglas`).
          example: "Agente (OpenAI)"

    GenerateAthleteAdaptationRequest:
      type: object
      required:
        - goal
      properties:
        goal:
          type: string
          example: "Descarga activa y recuperación funcional"
        muscleGroupEmphasis:
          type: array
          items:
            type: string
          example: ["Movilidad de cadera", "Core"]
        baseExercises:
          type: array
          nullable: true
          description: Ejercicios de la rutina base de la categoría o sesión a comparar y adaptar individualmente (KAN-464).
          items:
            $ref: '#/components/schemas/SuggestedRoutineExercise'

    SuggestedRoutineExercise:
      type: object
      required:
        - exerciseName
        - sets
        - reps
        - suggestedPercentage
      properties:
        exerciseName:
          type: string
          example: "Sentadilla Goblet con mancuerna"
        sets:
          type: integer
          example: 3
        reps:
          type: integer
          example: 10
        suggestedPercentage:
          type: number
          example: 50.0
        exerciseId:
          type: string
          format: uuid
          nullable: true
          example: "11111111-1111-1111-1111-111111111111"
        isReference:
          type: boolean
          example: false

    AdaptationChange:
      type: object
      required:
        - originalExerciseName
        - finalExerciseId
        - finalExerciseName
        - zone
        - reason
      properties:
        originalExerciseId:
          type: string
          format: uuid
          nullable: true
          example: "11111111-1111-1111-1111-111111111111"
        originalExerciseName:
          type: string
          example: "Sentadilla trasera con barra"
        finalExerciseId:
          type: string
          format: uuid
          example: "22222222-2222-2222-2222-222222222222"
        finalExerciseName:
          type: string
          example: "Prensa de piernas"
        zone:
          type: string
          example: "rodilla"
        reason:
          type: string
          example: "Sustitución por restricción activa en la zona indicada"
        availableSubstitutes:
          type: array
          nullable: true
          description: Lista ordenada de sustitutos autorizados del catálogo para ese ejercicio y zona (KAN-464).
          items:
            $ref: '#/components/schemas/AuthorizedSubstituteContext'

    RoutineAdaptationResponse:
      type: object
      required:
        - athleteId
        - proposedTitle
        - justificationSummary
        - exercises
        - aiProvider
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        proposedTitle:
          type: string
          example: "Sesión de Descarga Adaptativa"
        justificationSummary:
          type: string
          example: "Se adaptó la sesión para evitar ejercicios restringidos."
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedRoutineExercise'
        aiProvider:
          type: string
          example: "Agente (OpenAI)"
        id:
          type: string
          format: uuid
          nullable: true
          example: "9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d"
        wasAdapted:
          type: boolean
          example: true
        adaptationWarnings:
          type: array
          items:
            type: string
          example: ["La propuesta fue validada contra las restricciones y sustitutos autorizados del atleta."]
        adaptationChanges:
          type: array
          items:
            $ref: '#/components/schemas/AdaptationChange'
        baseExercises:
          type: array
          nullable: true
          description: Ejercicios originales de la rutina base de la categoría antes de aplicar la adaptación individual (KAN-464).
          items:
            $ref: '#/components/schemas/SuggestedRoutineExercise'

    ActiveInjuryContext:
      type: object
      required:
        - id
        - athleteId
        - zone
        - description
        - injuryDate
        - estimatedReturnDate
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        athleteId:
          type: string
          format: uuid
        zone:
          type: string
          example: "rodilla"
        description:
          type: string
          example: "Dolor rotuliano"
        injuryDate:
          type: string
          format: date-time
        estimatedReturnDate:
          type: string
          format: date-time
        status:
          type: string
          example: "Active"
        clearedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AthleteRecordContext:
      type: object
      required:
        - id
        - athleteId
        - exerciseId
        - exerciseName
        - weightOneRepMaxKg
        - origin
        - achievedAt
        - isCurrent
      properties:
        id:
          type: string
          format: uuid
        athleteId:
          type: string
          format: uuid
        exerciseId:
          type: string
          format: uuid
        exerciseName:
          type: string
          example: "Sentadilla con barra"
        weightOneRepMaxKg:
          type: number
          example: 120.0
        origin:
          type: string
          example: "Estimated"
        achievedAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
          example: true

    AuthorizedSubstituteContext:
      type: object
      required:
        - exerciseId
