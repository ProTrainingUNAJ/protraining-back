    HabitsRecommendationResponse:
      type: object
      description: >
        Recomendación de hábitos/nutrición para validación del PF (KAN-494).
        Extiende el esquema base con campos opcionales de seguridad y contexto (rangos, modo, menor, derivación,
        momentos y datos faltantes). dailyProteinRequirementGrams puede ser null cuando no es seguro/posible
        indicar cantidades (menor, objetivo bajar de peso, datos faltantes o derivación).
      required:
        - id
        - athleteId
        - athleticGoal
        - suggestedPlateComposition
        - hydrationAndSleepGuidelines
        - legalDisclaimer
        - approvedByPf
      properties:
        id:
          type: string
          format: uuid
          example: "d1e2f3a4-b5c6-7d8e-9f0a-1b2c3d4e5f6a"
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        athleticGoal:
          type: string
          example: "Ganar masa muscular"
        dailyProteinRequirementGrams:
          type: number
          format: double
          nullable: true
          description: >
            Referencia cuantitativa calculada por reglas cuando es segura (p.ej. rango objetivo definido).
            Null si no corresponde indicar cantidades. TODO(KAN-494): compatibilidad con clientes que esperen valor numérico.
          example: 120.0
        suggestedPlateComposition:
          type: string
          example: "Plato con alimentos aprobados, adaptado al objetivo y momentos detectados, sin suplementos."
        hydrationAndSleepGuidelines:
          type: string
          example: "Consumir agua de forma regular y procurar descanso suficiente para la recuperación."
        legalDisclaimer:
          type: string
          example: "Esto es una recomendación general; para un plan a tu medida, consultá a un nutricionista."
        approvedByPf:
          type: boolean
          example: false
        minProteinGrams:
          type: number
          format: double
          nullable: true
          description: >
            Límite inferior del rango diario de proteína (g) fijado por reglas en el backend. La IA sólo redacta;
            nunca puede reemplazar este valor. Null en modos sin cantidades.
          example: 100.0
        maxProteinGrams:
          type: number
          format: double
          nullable: true
          description: >
            Límite superior del rango diario de proteína (g) fijado por reglas en el backend. Null en modos sin cantidades.
          example: 140.0
        recommendationMode:
          type: string
          nullable: true
          description: "Modo de recomendación: Quantitative, Qualitative o Referral."
          example: "Quantitative"
        isMinor:
          type: boolean
          description: Indica si el atleta es menor de edad (sin cantidades de proteína).
          example: false
        requiresProfessionalReferral:
          type: boolean
          description: >
            Indica si se recomienda derivación a profesional por seguridad. Verdadero ante riesgo médico registrado,
            ficha médica vacía/incompleta/no verificable, objetivo de pérdida de peso o datos críticos ausentes.
            En ese caso no se entregan cantidades ni estrategias de pérdida de peso.
          example: false
        referralReasons:
          type: array
          nullable: true
          items:
            type: string
          description: Motivos de derivación o precaución.
        detectedMoments:
          type: array
          nullable: true
          items:
            type: string
          description: Momentos detectados (día pesado, partido cercano, poco descanso) cuando hay datos.
        missingData:
          type: array
          nullable: true
          items:
            type: string
          description: >
            Datos faltantes o pendientes de definición/validación que impiden una pauta completa (por ejemplo,
            peso/objetivo sin fuente, día pesado sin criterio aprobado, partido/descanso no inferibles,
            check-ins con fecha futura o ficha médica no verificable). No implica que el dato sea cero.
        weightKg:
          type: number
          format: double
          nullable: true
          description: >
            Peso corporal informado por la fuente configurada y usado para el cálculo. Null significa "sin dato":
            el backend no lo estima ni lo reemplaza por valores de otros dominios (1RM, carga, objetivos de plan).
          example: 70.0
        provider:
          type: string
          nullable: true
          description: Proveedor/redacción utilizada (IA o reglas).
          example: "Reglas"
        status:
          type: string
          nullable: true
          description: Estado de revisión de la recomendación (Pending, Approved, Discarded).
          example: "Pending"

