openapi: 3.0.3
info:
  title: ProTraining - Microservicio de Asistente IA
  description: >
    API v1 para el copiloto inteligente del preparador físico. Funciona bajo un esquema
    híbrido y resiliente: modelo local en Ollama (Llama) como opción principal, API de Gemini
    como respaldo ante fallos y reglas determinísticas locales en caso de desconexión.
    Genera alertas preventivas de fatiga/lesión, propone ajustes del día por molestias marcadas
    en el check-in, sugiere rutinas estructuradas y redacta recomendaciones de hábitos y alimentación
    sujetas a aprobación humana explícita del preparador físico en un solo clic.
  version: 1.2.0
servers:
  - url: http://localhost:8085
    description: Entorno local / Docker Compose
  - url: http://asistente:8080
    description: Red interna de Docker entre microservicios

security:
  - BearerAuth: []

tags:
  - name: Preventive Alerts
    description: Detección proactiva de fatiga, sobrecarga y riesgo lesional
  - name: Daily Adjustment
    description: Adaptaciones inmediatas de la sesión cuando el atleta marca dolor en el check-in
  - name: Copilot and Planning
    description: Generación estructurada de propuestas de entrenamiento y descarga con IA
  - name: Habits and Nutrition
    description: Recomendaciones de descanso, hidratación y pautas alimentarias aprobadas por el PF
  - name: Health
    description: Monitoreo de disponibilidad del servicio y base de datos

paths:
  /api/v1/alerts:
    get:
      tags:
        - Preventive Alerts
      summary: Listar alertas preventivas generadas
      description: Devuelve las alertas calculadas por el motor analítico, permitiendo filtrar por estado de revisión o severidad.
      operationId: listAlerts
      parameters:
        - name: onlyUnreviewed
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Si es true, retorna únicamente las alertas pendientes de acción por el PF.
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [Low, Medium, High]
          description: Filtrar por severidad de la alerta.
      responses:
        "200":
          description: Lista de alertas preventivas recuperadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreventiveAlert'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/alerts/{alertId}/review:
    patch:
      tags:
        - Preventive Alerts
      summary: Marcar alerta preventiva como revisada
      description: Registra la intervención del preparador físico sobre la recomendación generada.
      operationId: reviewAlert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Alerta actualizada como revisada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Alerta marcada como revisada exitosamente."
                  alertId:
                    type: string
                    format: uuid
                    example: "8e41bf39-3f04-4b95-a112-9c3f0c13bb10"
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/alerts/scan:
    post:
      tags:
        - Preventive Alerts
      summary: Disparar escaneo preventivo inmediato
      description: >
        Ejecuta el ciclo de análisis heurístico y de IA sobre las sesiones, check-ins,
        partidos próximos del fixture y lesiones, alertando sobre situaciones críticas.
      operationId: triggerPreventiveScan
      responses:
        "202":
          description: Análisis preventivo iniciado en segundo plano.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Escaneo preventivo ejecutado correctamente. Se analizaron todos los atletas activos."
                  alertsGenerated:
                    type: integer
                    example: 2
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/assistant/today-adjustment:
    post:
      tags:
        - Daily Adjustment
      summary: Proponer adaptación de la rutina de hoy ante reporte de dolor
      description: >
        Cruza la rutina planificada para hoy con el dolor o molestia reportado en el check-in.
        Si hay conflicto articular o muscular, sugiere sustituir o reducir ejercicios (ej. retirar saltos por dolor de rodilla).
        El PF valida y aprueba la adaptación en un solo clic.
      operationId: suggestTodayAdjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodayAdjustmentRequest'
      responses:
        "200":
          description: Propuesta de ajuste generada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayAdjustmentResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/assistant/suggest-routine:
    post:
      tags:
        - Copilot and Planning
      summary: Generar propuesta estructurada de rutina con IA
      description: >
        Solicita al copiloto IA una recomendación de entrenamiento adaptada a un atleta o categoría,
        tomando en cuenta sus récords vigentes, check-ins recientes y antecedentes de lesión.
      operationId: suggestRoutineWithAi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestRoutineRequest'
      responses:
        "200":
          description: Propuesta de rutina generada en formato estructurado JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestRoutineResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/assistant/plan-drafts:
    post:
      tags:
        - Copilot and Planning
      summary: Generar y persistir un nuevo borrador de planificación con IA
      description: >
        Genera un borrador de planificación multisesión a través de la cadena resiliente de IA
        (Ollama -> Gemini -> Reglas), validando esquema e identificadores del catálogo oficial y
        persistiéndolo en la base de datos bajo aislamiento multi-tenant.
      operationId: createPlanDraftWithAi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanDraftRequest'
      responses:
        "201":
          description: Borrador de planificación generado y persistido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assistant/plan-drafts/{id}:
    get:
      tags:
        - Copilot and Planning
      summary: Obtener un borrador de planificación por su identificador
      description: Devuelve el borrador generado por la IA siempre que pertenezca al preparador físico autenticado.
      operationId: getPlanDraftById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Borrador de planificación recuperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Copilot and Planning
      summary: Editar y reemplazar el contenido de un borrador de planificación
      description: >
        Permite al preparador físico modificar cualquier parte del borrador en estado Draft.
        Ejecuta validaciones de esquema, existencia en el catálogo oficial, rangos deportivos y topes
        pre-partido, guardando además las sustituciones o eliminaciones de ejercicios en la memoria del PF.
      operationId: updatePlanDraft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanDraftRequest'
      responses:
        "200":
          description: Borrador actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/assistant/plan-drafts/{id}/approve:
    post:
      tags:
        - Copilot and Planning
      summary: Aprobar borrador de planificación y crearlo en Entrenamiento
      description: >
        Transforma el borrador aprobado en un SaveTrainingPlanRequest, lo crea en el microservicio de
        Entrenamiento reenviando el token del preparador físico y lo asigna a la categoría o atleta con la
        fecha de inicio configurada. Si el borrador ya estaba aprobado, devuelve el planId existente sin
        duplicar la planificación.
      operationId: approvePlanDraft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Borrador aprobado y planificación creada en Entrenamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovePlanDraftResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assistant/plan-drafts/{id}/discard:
    post:
      tags:
        - Copilot and Planning
      summary: Descartar un borrador de planificación generado por la IA
      description: Pasa el borrador al estado Discarded impidiendo futuras ediciones o aprobaciones.
      operationId: discardPlanDraft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Borrador descartado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDraftResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/assistant/athletes/{athleteId}/decisions:
    get:
      tags:
        - Copilot and Planning
      summary: Consultar decisiones históricas del PF sobre propuestas del asistente
      description: >
        Devuelve el historial reciente de decisiones (aprobaciones, cambios o rechazos) tomadas por el preparador físico
        autenticado sobre ejercicios sugeridos para el atleta especificado, con filtro opcional por zona anatómica y limitado
        a las últimas 50 decisiones. Responde 404 si el atleta no existe o no pertenece al preparador físico.
      operationId: getAthleteDecisions
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único del atleta.
        - name: zone
          in: query
          required: false
          schema:
            type: string
          description: Filtro opcional por zona anatómica o de molestia (ej. espalda_baja).
      responses:
        "200":
          description: Lista de decisiones recuperadas (hasta 50).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PfDecisionResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/habits-recommendation:
    get:
      tags:
        - Habits and Nutrition
      summary: Obtener recomendación de hábitos y nutrición según objetivo
      description: >
        Genera consejos de descanso, hidratación y requerimiento proteico diario según el peso y objetivo del atleta
        (basado en reglas fijas; sin suplementos; si el atleta es menor requiere consentimiento del tutor).
      operationId: getHabitsRecommendation
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recomendación generada lista para validación del PF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitsRecommendationResponse'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/habits-recommendations/{recommendationId}/approve:
    patch:
      tags:
        - Habits and Nutrition
      summary: Aprobar recomendación de hábitos por el preparador físico
      description: El PF autoriza con un solo clic que la recomendación sea visible para el atleta en su PWA.
      operationId: approveHabitsRecommendation
      parameters:
        - name: recommendationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recomendación aprobada y publicada para el atleta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Recomendación de hábitos aprobada y visible para el atleta."
        "404":
          $ref: '#/components/responses/NotFound'

  /api/health:
    get:
      tags:
        - Health
      summary: Chequeo de salud del servicio
      security: []
      operationId: healthCheck
      responses:
        "200":
          description: Servicio saludable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Healthy"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: No autenticado o credenciales inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Recurso o alerta no encontrada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: El microservicio dependiente no está disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    PreventiveAlert:
      type: object
      required:
        - id
        - athleteId
        - athleteName
        - generatedAt
        - severity
        - reason
        - suggestion
        - reviewed
      properties:
        id:
          type: string
          format: uuid
          example: "8e41bf39-3f04-4b95-a112-9c3f0c13bb10"
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        athleteName:
          type: string
          example: "Lucas Fernández"
        generatedAt:
          type: string
          format: date-time
          example: "2026-10-10T08:00:00Z"
        severity:
          type: string
          enum: [Low, Medium, High]
          example: "High"
        reason:
          type: string
          example: "Sobrecarga acumulada: 3 sesiones consecutivas con esfuerzo >= 8 y registro de descanso menor a 5 horas."
        suggestion:
          type: string
          example: "Programar una sesión de descarga o movilidad pasiva. Reducir volumen general un 30%."
        reviewed:
          type: boolean
          example: false

    TodayAdjustmentRequest:
      type: object
      required:
        - athleteId
        - reportedPainZones
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        reportedPainZones:
          type: string
          example: "Rodilla derecha, tendón rotuliano"
        daysUntilNextMatch:
          type: integer
          nullable: true
          example: 3

    TodayAdjustmentResponse:
      type: object
      required:
        - requiresAdjustment
        - reason
        - adjustmentSuggestion
      properties:
        requiresAdjustment:
          type: boolean
          example: true
        reason:
          type: string
          example: "Conflicto entre molestia en rodilla derecha y ejercicios de impacto planificados para hoy."
        adjustmentSuggestion:
          type: string
          example: "Retirar los saltos al cajón y sustituir sentadilla pesada por prensa unilateral al 50% de 1RM."
        modifiedExercises:
          type: array
          items:
            type: object
            properties:
              originalExercise:
                type: string
                example: "Salto al cajón pliométrico"
              substituteExercise:
                type: string
                example: "Movilidad de tobillo y cadera sin carga"

    SuggestRoutineRequest:
      type: object
      required:
        - athleteId
        - goal
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        goal:
          type: string
          example: "Descarga activa y recuperación funcional"
        muscleGroupEmphasis:
          type: array
          items:
            type: string
          example: ["Movilidad de cadera", "Core"]

    SuggestRoutineResponse:
      type: object
      required:
        - athleteId
        - proposedTitle
        - justificationSummary
        - exercises
        - aiProvider
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        proposedTitle:
          type: string
          example: "Sesión de Descarga Adaptativa"
        justificationSummary:
          type: string
          example: "Se redujo el volumen un 40% debido a reportes recientes de fatiga alta (RPE 8) y descanso insuficiente."
        exercises:
          type: array
          items:
            type: object
            required:
              - exerciseName
              - sets
              - reps
              - suggestedPercentage
            properties:
              exerciseName:
                type: string
                example: "Sentadilla Goblet con mancuerna"
              sets:
                type: integer
                example: 3
              reps:
                type: integer
                example: 10
              suggestedPercentage:
                type: number
                example: 50.0
        aiProvider:
          type: string
          description: Proveedor de IA o motor que originó la propuesta (Ollama, Gemini o Rules).
          enum: [Ollama, Gemini, Rules]
          example: "Gemini"

    PlanDraftExercise:
      type: object
      required:
        - exerciseId
        - order
        - sets
        - reps
      properties:
        exerciseId:
          type: string
          format: uuid
          example: "11111111-1111-1111-1111-111111111111"
        order:
          type: integer
          minimum: 1
          example: 1
        sets:
          type: integer
          minimum: 1
          maximum: 10
          example: 4
        reps:
          type: integer
          minimum: 1
          maximum: 30
          example: 6
        targetPercentage:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          example: 75.0

    PlanDraftSession:
      type: object
      required:
        - name
        - dayOfWeek
        - order
        - exercises
      properties:
        name:
          type: string
          example: "Fuerza Tren Inferior"
        dayOfWeek:
          type: string
          enum: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
          example: "Monday"
        order:
          type: integer
          minimum: 1
          example: 1
        coachNotes:
          type: string
          nullable: true
          example: "Cuidar profundidad de sentadilla."
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlanDraftExercise'

    PlanDraftWeek:
      type: object
      required:
        - weekNumber
        - sessions
      properties:
        weekNumber:
          type: integer
          minimum: 1
          maximum: 8
          example: 1
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/PlanDraftSession'

    CreatePlanDraftRequest:
      type: object
      required:
        - goal
      properties:
        athleteId:
          type: string
          format: uuid
          nullable: true
          description: Identificador del atleta destinatario (mutuamente excluyente con categoryId).
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la categoría grupal destinataria (mutuamente excluyente con athleteId).
          example: "11111111-1111-1111-1111-111111111111"
        goal:
          type: string
          maxLength: 500
          description: Objetivo deportivo o fisiológico del ciclo de entrenamiento.
          example: "Desarrollar fuerza explosiva y potencia muscular para fase competitiva."
        weeks:
          type: integer
          minimum: 1
          maximum: 8
          default: 4
          description: Cantidad de semanas del plan (1 a 8).
          example: 4
        daysPerWeek:
          type: integer
          minimum: 1
          maximum: 6
          default: 3
          description: Frecuencia semanal de sesiones (1 a 6).
          example: 3
        trainingDays:
          type: array
          items:
            type: string
          description: Días sugeridos de entrenamiento dentro de la semana.
          example: ["Lunes", "Miércoles", "Viernes"]
        startDate:
          type: string
          format: date
          nullable: true
          description: Fecha de inicio del plan (por defecto el próximo lunes en Argentina).
          example: "2026-11-02"

    UpdatePlanDraftRequest:
      type: object
      required:
        - name
        - objective
        - justificationSummary
        - weeks
      properties:
        name:
          type: string
          example: "Mesociclo de Fuerza Base"
        objective:
          type: string
          example: "Incrementar fuerza en tren inferior sin comprometer el partido del sábado"
        justificationSummary:
          type: string
          example: "Progresión lineal de 4 semanas con descarga pre-partido."
        weeks:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/PlanDraftWeek'

    PlanDraftResponse:
      type: object
      required:
        - id
        - goal
        - startDate
        - status
        - provider
        - name
        - objective
        - justificationSummary
        - weeks
      properties:
        id:
          type: string
          format: uuid
          example: "9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d"
        categoryId:
          type: string
          format: uuid
          nullable: true
          example: "2fa85f64-5717-4562-b3fc-2c963f66afa1"
        athleteId:
          type: string
          format: uuid
          nullable: true
          example: null
        goal:
          type: string
          example: "Fuerza de piernas para pretemporada"
        startDate:
          type: string
          format: date
          example: "2026-11-02"
        status:
          type: string
          enum: [Draft, Approved, Discarded]
          example: "Draft"
        provider:
          type: string
          example: "Ollama"
        approvedPlanId:
          type: string
          format: uuid
          nullable: true
          example: null
        name:
          type: string
          example: "Mesociclo de Fuerza Base"
        objective:
          type: string
          example: "Incrementar fuerza en tren inferior"
        justificationSummary:
          type: string
          example: "Progresión lineal de 4 semanas."
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/PlanDraftWeek'
        warnings:
          type: array
          items:
            type: string
          example: ["Ajustado por el partido del sábado 7/11: Sentadilla trasera con barra 85 % → 60 %"]

    ApprovePlanDraftResponse:
      type: object
      required:
        - id
        - planId
        - approvedPlanId
        - status
        - assigned
      properties:
        id:
          type: string
          format: uuid
          example: "9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d"
        planId:
          type: string
          format: uuid
