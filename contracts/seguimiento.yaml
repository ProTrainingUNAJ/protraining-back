openapi: 3.0.3
info:
  title: ProTraining - Microservicio de Seguimiento
  description: >
    API v1 para el registro diario de bienestar (<30 segundos), semáforo tricolor de fatiga,
    carga de actividad en minutos con asistencia automática, comparativa frente al grupo
    y gestión del ciclo de vida de lesiones deportivas (Active -> InRecovery -> Cleared).
  version: 1.8.0
servers:
  - url: http://localhost:8084
    description: Entorno local / Docker Compose
  - url: http://seguimiento:8080
    description: Red interna de Docker entre microservicios

security:
  - BearerAuth: []

tags:
  - name: Check-in and Traffic Light
    description: Reporte diario de bienestar subjetivo y semáforo tricolor para el preparador físico
  - name: Loads and Attendance
    description: Registro de minutos de actividad diaria y asistencia automática sin tomar lista
  - name: Evolution and Benchmark
    description: Comparativa anónima de métricas del atleta contra el promedio de su categoría
  - name: Injuries
    description: Registro clínico de lesiones y transiciones controladas de estado
  - name: Fitness Tests
    description: Catálogo de tests físicos estandarizados por capacidad motora para armar baterías de evaluación
  - name: Health
    description: Monitoreo de disponibilidad del servicio y base de datos

paths:
  /api/v1/athletes/{athleteId}/check-in:
    post:
      tags:
        - Check-in and Traffic Light
      summary: Enviar o actualizar check-in diario del atleta
      description: >
        Registra el reporte de bienestar en menos de 30 segundos. Evalúa las respuestas mediante
        umbrales y clasifica de inmediato al atleta en el semáforo tricolor (Green, Yellow o Red).
      operationId: submitCheckIn
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        "200":
          description: Check-in actualizado para el mismo día y semáforo recalculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        "201":
          description: Check-in registrado exitosamente y semáforo calculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: La cuenta no tiene un atleta vinculado, o el atleta de la ruta no es el del token (nunca 403, para no revelar si el id existe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/athletes/{athleteId}/check-in/injuries:
    get:
      tags:
        - Check-in and Traffic Light
      summary: Listar las molestias activas de un atleta para puntuar en el check-in
      description: >
        Devuelve las molestias del atleta que aún no fueron dadas de alta (Active o InRecovery),
        para que el check-in diario exija puntuar el dolor (0 a 10) de cada una. Accesible por
        el preparador físico dueño o por el propio atleta.
      operationId: listCheckInInjuries
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de molestias activas (puede ser vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Injury'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/check-in/injuries/resolved:
    get:
      tags:
        - Check-in and Traffic Light
      summary: Listar las molestias resueltas de un atleta con su pico de dolor
      description: >
        Devuelve las molestias del atleta que ya fueron dadas de alta (MedicallyCleared),
        incluyendo el pico de dolor (máximo nivel registrado durante su evolución).
        Accesible por el preparador físico dueño o por el propio atleta.
      operationId: listResolvedInjuries
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de molestias resueltas (puede ser vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Injury'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/internal/check-ins/done:
    post:
      tags:
        - Check-in and Traffic Light
      summary: Consultar atletas que completaron el check-in en una fecha
      description: Endpoint interno para microservicios con rol Servicio (worker de recordatorios). Devuelve los IDs de los atletas que ya completaron el check-in.
      operationId: getCompletedCheckIns
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
                - pfId
                - athleteIds
              properties:
                date:
                  type: string
                  format: date
                  example: "2026-10-26"
                pfId:
                  type: string
                  format: uuid
                  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                athleteIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Lista de IDs de atletas que ya completaron su check-in.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/athletes/{athleteId}/check-in/today:
    get:
      tags:
        - Check-in and Traffic Light
      summary: Obtener el check-in del día del atleta
      description: >
        Devuelve el check-in registrado hoy (calculado en hora de Argentina) por el atleta,
        incluyendo las zonas de dolor reportadas (painZones). Exclusivo para el preparador físico
        autenticado; responde 404 si el atleta todavía no completó el check-in de hoy o no pertenece al PF.
      operationId: getTodayCheckIn
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Check-in del día obtenido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/check-ins:
    get:
      tags:
        - Check-in and Traffic Light
      summary: Historial de check-ins de un atleta
      description: Devuelve los registros de bienestar diarios del atleta (por defecto los últimos 14 registros).
      operationId: listAthleteCheckIns
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 14
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-01-01"
          description: Fecha inicial del rango de consulta (inclusive).
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-11-01"
          description: Fecha final del rango de consulta (inclusive).
      responses:
        "200":
          description: Historial de check-ins obtenido.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckIn'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/daily-load:
    post:
      tags:
        - Loads and Attendance
      summary: Registrar minutos de actividad física del día
      description: >
        El atleta reporta los minutos dedicados a gimnasio, práctica de su deporte, partido o
        trabajo individual. De aquí se deducen el volumen diario y la asistencia automática sin tomar lista.
      operationId: registerDailyLoad
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyLoadRequest'
      responses:
        "200":
          description: Carga del día actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLoadResponse'
        "201":
          description: Carga del día registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLoadResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - Loads and Attendance
      summary: Obtener la carga del día del atleta
      operationId: getDailyLoad
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Carga del día obtenida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyLoadResponse'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/daily-load/week:
    get:
      tags:
        - Loads and Attendance
      summary: Obtener la semana del atleta con los días completados
      description: >
        Devuelve los 7 días de la semana (lunes a domingo) del atleta, marcando
        cuáles tienen carga del día registrada.
      operationId: getAthleteWeek
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Semana del atleta obtenida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteWeek'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  # KAN-445: corrección manual de asistencia por el PF (agregado en esta rama).
  /api/v1/athletes/{athleteId}/attendance:
    patch:
      tags:
        - Loads and Attendance
      summary: Corregir asistencia manualmente
      description: >
        El preparador físico marca presente o ausente a un atleta cuando figura
        "sin registro" (no cargó su entrenamiento del día).
      operationId: setAttendance
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAttendanceRequest'
      responses:
        "204":
          description: Asistencia corregida.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/categories/{categoryId}/attendance-today:
    get:
      tags:
        - Loads and Attendance
      summary: Consultar asistencia automática del día por categoría
      description: Consolida quiénes entrenaron hoy a partir de las cargas de entrenamiento cargadas por los propios atletas.
      operationId: getCategoryAttendanceToday
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumen de asistencia de la categoría.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttendanceSummary'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/categories/{categoryId}/traffic-light-today:
    get:
      tags:
        - Check-in and Traffic Light
      summary: Consultar semáforo tricolor de hoy por categoría
      description: >
        Pantalla central del preparador físico en el día a día. Consolida el estado tricolor de bienestar
        (Green, Yellow, Red) de cada atleta de la división para la jornada actual, permitiendo detectar
        rápidamente a quienes requieren atención o ajuste de cargas antes de iniciar la práctica.
      operationId: getCategoryTrafficLightToday
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Semáforo de la categoría para el día de hoy obtenido exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AthleteTrafficLightSummary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/categories/{categoryId}/averages:
    get:
      tags:
        - Evolution and Benchmark
      summary: Consultar promedios de tests y wellness por categoría
      description: >
        Obtiene los promedios aritméticos agregados de tests de aptitud física y de métricas
        semanales de bienestar (wellness) para los atletas de una categoría específica.
        Garantía estricta de privacidad: no expone identificadores, nombres ni mediciones individuales.
      operationId: getCategoryAverages
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: weekStart
          in: query
          required: false
          description: Fecha de inicio de la semana de consulta (formato YYYY-MM-DD). Si no se especifica, se toma el lunes de la semana actual en hora de Argentina.
          schema:
            type: string
            format: date
            example: "2026-10-26"
      responses:
        "200":
          description: Promedios de la categoría obtenidos exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAveragesResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/group-benchmark:
    get:
      tags:
        - Evolution and Benchmark
      summary: Consultar perfil del atleta frente al promedio de su grupo
      description: >
        Retorna la evolución del atleta comparada exclusivamente contra el promedio
        anónimo de su categoría (garantía de seguridad: ningún atleta ve los datos individuales de sus compañeros).
      operationId: getGroupBenchmark
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Métricas comparativas obtenidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBenchmarkResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/injuries:
    get:
      tags:
        - Injuries
      summary: Listar lesiones de un atleta
      description: Obtiene el historial de lesiones registradas para un atleta, permitiendo filtrar por su estado actual. Responde 404 si el atleta no existe o es de otro PF.
      operationId: listAthleteInjuries
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Active, InRecovery, Cleared]
      responses:
        "200":
          description: Lista de lesiones obtenida con éxito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Injury'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Injuries
      summary: Registrar una nueva lesión
      description: Da de alta una lesión para el atleta en estado inicial 'Active'. Responde 404 si el atleta no existe o es de otro PF.
      operationId: createInjury
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInjuryRequest'
      responses:
        "201":
          description: Lesión registrada con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/injuries/{injuryId}/status:
    patch:
      tags:
        - Injuries
      summary: Actualizar estado de una lesión (Máquina de estados)
      description: >
        Realiza la transición de estado de una lesión. Regla de negocio estricta:
        Una lesión 'Active' no puede pasar directamente a 'Cleared' sin haber transitado por 'InRecovery'.
      operationId: updateInjuryStatus
      parameters:
        - name: injuryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInjuryStatusRequest'
      responses:
        "200":
          description: Transición de estado aplicada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'
        "400":
          description: Transición inválida (ej. intentar pasar de Active a Cleared directamente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/fitness-tests:
    get:
      tags:
        - Fitness Tests
      summary: Catálogo de tests físicos por capacidad motora
      description: >
        Devuelve el catálogo de tests de evaluación física activos (los tests desactivados
        no se exponen). Con el parámetro opcional motorCapacity filtra por tipo de capacidad
        motora (ej. Power devuelve Salto Vertical CMJ y Salto Abalakov); sin parámetro
        devuelve todos los tests activos.
      operationId: listFitnessTests
      parameters:
        - name: motorCapacity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MotorCapacity'
          description: Capacidad motora por la cual filtrar el catálogo.
      responses:
        "200":
          description: Catálogo de tests obtenido (lista vacía si el filtro no tiene resultados).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FitnessTest'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/athletes/{athleteId}/fitness-tests:
    get:
      tags:
        - Fitness Tests
        - Evolution and Benchmark
      summary: Historial de tests físicos de un atleta
      description: >
        Devuelve el historial de resultados de pruebas físicas del atleta, con opción
        de filtrar por un test específico del catálogo y por rango de fechas.
      operationId: listAthleteFitnessTests
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: testId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Identificador del test del catálogo para consultar su evolución.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-01-01"
          description: Fecha inicial del rango de consulta (inclusive).
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-11-01"
          description: Fecha final del rango de consulta (inclusive).
      responses:
        "200":
          description: Historial de tests obtenido con éxito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AthleteFitnessTest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/evolution:
    get:
      tags:
        - Evolution and Benchmark
      summary: Consultar evolución temporal unificada de un atleta
      description: >
        Consolida en una vista temporal unificada día a día la progresión histórica de
        fuerza (1RM), capacidades atléticas (salto/velocidad) y fatiga/wellness a lo
        largo de las semanas (por defecto, los últimos 3 meses).
      operationId: getAthleteEvolution
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: months
          in: query
          required: false
          schema:
            type: integer
            default: 3
          description: Cantidad de meses hacia atrás para la consulta histórica (por defecto 3 meses).
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-08-01"
          description: Fecha inicial personalizada del rango (inclusive). Tiene prioridad sobre months.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-11-01"
          description: Fecha final personalizada del rango (inclusive). Por defecto es hoy en hora de Argentina.
      responses:
        "200":
          description: Curvas de evolución obtenidas con éxito y listas para graficar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteEvolutionResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/field-test-sessions:
    get:
      tags:
        - Fitness Tests
      summary: Sesiones de test de campo de una categoría
      description: >
        Devuelve el resumen (id, categoría, fecha, nombre y estado) de las sesiones de la
        categoría pedida, de la más reciente a la más antigua. Solo aparecen las sesiones
        del PF autenticado: las de otro PF no se devuelven. Sin tests ni resultados, para
        que la pantalla que elige la sesión sea liviana.
      operationId: listFieldTestSessions
      parameters:
        - name: categoryId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
      responses:
        "200":
          description: Listado obtenido con éxito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldTestSessionSummary'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Fitness Tests
      summary: Crear una sesión de test de campo
      description: >
        Crea la sesión con sus pruebas del catálogo en el orden de evaluación. Estado
        inicial Planned. Responde 404 si la categoría no existe o es de otro PF; 400 si
        la lista de pruebas está vacía, si se repite una prueba o si alguna no existe en
        el catálogo.
      operationId: createFieldTestSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldTestSessionRequest'
      responses:
        "201":
          description: Sesión creada con éxito (estado Planned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTestSession'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/field-test-sessions/{sessionId}/status:
    patch:
      tags:
        - Fitness Tests
      summary: Cambiar el estado de la sesión
      description: >
        Avanza el estado de la sesión en orden estricto Planned -> InProgress -> Closed.
        Un salto (Planned -> Closed), una reapertura o repetir el estado actual responde
        400 con el detalle de la transición no permitida (orden: Planificada -> En curso
        -> Cerrada). La sesión no exista o sea de otro PF → 404.
      operationId: updateFieldTestSessionStatus
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldTestSessionStatusRequest'
      responses:
        "200":
          description: Estado actualizado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTestSessionSummary'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/field-test-sessions/{sessionId}:
    get:
      tags:
        - Fitness Tests
      summary: Sesión de test de campo con sus resultados
      description: >
        Devuelve la sesión de test de campo con sus tests del catálogo (en orden de
        evaluación) y los resultados cargados por atleta. Responde 404 si la sesión no
        existe o es de otro PF.
      operationId: getFieldTestSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sesión obtenida con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTestSession'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/field-test-sessions/{sessionId}/results:
    post:
      tags:
        - Fitness Tests
      summary: Carga rápida de un resultado de campo
      description: >
        Registra el valor de un atleta para un test de la sesión. Responde 404 si la
        sesión no existe o es de otro PF, o si el atleta no existe o es de otro PF (en
        ese caso no se persiste nada). Responde 409 si el mismo (sesión, prueba, atleta
        e intento) ya fue cargado. Si la sesión está en estado Closed responde 400
        "La sesión ya está cerrada." (KAN-427). Si la prueba no forma parte de la sesión
        responde 400 (KAN-568).
      operationId: createFieldTestResult
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldTestResultRequest'
      responses:
        "201":
          description: Resultado registrado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTestResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/field-test-sessions/{sessionId}/results/{resultId}:
    put:
      tags:
        - Fitness Tests
      summary: Corregir un resultado de campo
      description: >
        Actualiza el valor y el intento de un resultado ya cargado. Responde 404 si la
        sesión o el resultado no existen o son de otro PF. Responde 409 si la corrección
        choca con un resultado ya cargado (misma prueba, atleta e intento). Si la sesión
        está en estado Closed responde 400 "La sesión ya está cerrada." (KAN-427).
      operationId: updateFieldTestResult
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: resultId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldTestResultRequest'
      responses:
        "200":
          description: Resultado actualizado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTestResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/field-test-sessions/{sessionId}/results/{resultId}/confirm:
    post:
      tags:
        - Fitness Tests
      summary: Confirmar un resultado de fuerza y sincronizar el 1RM
      description: >
        Confirma un resultado de fuerza (test en kg) y envía de forma síncrona el 1RM
        testeado al microservicio Entrenamiento con origen TestedInSession, resolviendo
        el ejercicio homónimo por nombre exacto la primera vez (el GUID resuelto queda
        cacheado en la prueba del catálogo). Responde 404 si la sesión, el resultado o
        la prueba no existen o son de otro PF; 400 si el test no genera récord 1RM o si
        Entrenamiento no tiene un ejercicio con ese nombre; y 503 si Entrenamiento no
        responde tras los reintentos de Polly (la confirmación no quedó registrada allí).
        Re-confirmar una marca ya confirmada responde 200 sin volver a llamar a
        Entrenamiento (idempotente, KAN-568); si la marca se corrige con PUT, queda
        pendiente de reconfirmar. Si la sesión está en estado Closed responde 400
        "La sesión ya está cerrada." y no se envía ningún 1RM (KAN-427).
      operationId: confirmFieldTestResult
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: resultId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resultado confirmado y 1RM sincronizado con Entrenamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTestResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'

  /api/health:
    get:
      tags:
        - Health
      summary: Chequeo de salud del servicio
      security: []
      operationId: healthCheck
      responses:
        "200":
          description: Servicio saludable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Healthy"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Parámetros inválidos o violación de reglas de validación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Token de autenticación ausente o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Atleta o lesión no encontrados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: "Acceso denegado: el token no corresponde al atleta de la ruta o rol no autorizado."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: >
        Servicio dependiente no disponible (Estructura o Entrenamiento no respondió
        tras los reintentos de Polly). La operación no se completó y puede reintentarse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    CheckInRequest:
      type: object
      required:
        - sleepHours
        - sleepQuality
        - muscleSoreness
        - fatigueLevel
        - moodRate
        - stressLevel
      properties:
        sleepHours:
          type: number
          format: double
          minimum: 0
          maximum: 24
          description: >
            Horas de sueño de 0 a 12 (decimales permitidos); 13 significa "más de 12 horas".
            Cualquier valor mayor a 12 se guarda como 13.
          example: 7.5
        sleepQuality:
          type: integer
          minimum: 1
          maximum: 5
          description: Calidad de descanso de 1 (pésima) a 5 (óptima).
          example: 4
        muscleSoreness:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel de dolor muscular/articular (1 = ninguno, 5 = dolor severo).
          example: 1
        fatigueLevel:
          type: integer
          minimum: 1
          maximum: 5
          example: 2
        moodRate:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        stressLevel:
          type: integer
          minimum: 1
          maximum: 5
          example: 2
        effortRate:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
          example: 7
        isSick:
          type: boolean
          default: false
          example: false
        painZones:
          type: string
          nullable: true
          example: "Isquiotibial derecho"
        hasActiveInjury:
          type: boolean
          default: false
          description: Lesión activa marcada por el atleta; el semáforo del día queda en Rojo.
          example: false
        injuries:
           type: array
           nullable: true
           description: >
             Puntaje de dolor (0 a 10) de cada molestia activa del atleta. Obligatorio (un item
             por molestia activa) si el atleta tiene molestias activas; el 0 es válido ("ya no duele").
           items:
             type: object
             required:
               - injuryId
               - level
             properties:
               injuryId:
                 type: string
                 format: uuid
               level:
                 type: integer
                 minimum: 0
                 maximum: 10

        date:
          type: string
          format: date
          nullable: true
          description: Fecha original del check-in (dia en Argentina). La manda el front al sincronizar un check-in guardado sin conexion; si no viene, se usa la fecha del servidor.
          example: "2026-10-26"

    CheckInResponse:
      type: object
      required:
        - message
        - trafficLight
        - checkIn
      properties:
        message:
          type: string
          example: "Check-in completado exitosamente."
        trafficLight:
          type: string
          enum: [Green, Yellow, Red]
          example: "Green"
        trafficLightReason:
          type: string
          nullable: true
          example: "Sin alertas de sobrecarga"
        checkIn:
          $ref: '#/components/schemas/CheckIn'

    CheckIn:
      type: object
      description: Objeto compartido de Check-In.
      required:
        - id
        - athleteId
        - date
        - trafficLight
        - sleepHours
        - muscleSoreness
        - fatigueLevel
        - moodRate
        - stressLevel
        - isSick
      properties:
        id:
          type: string
          format: uuid
          example: "6c24fcf8-0fb5-48b2-b01f-0e4c67eb2581"
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        date:
          type: string
          format: date
          example: "2026-10-10"
        trafficLight:
          type: string
          enum: [Green, Yellow, Red]
          example: "Green"
        trafficLightReason:
          type: string
          nullable: true
          example: "Sin alertas de sobrecarga"
        sleepHours:
          type: number
          format: double
          example: 7.5
        sleepQuality:
          type: integer
          example: 4
        muscleSoreness:
          type: integer
          example: 1
        fatigueLevel:
          type: integer
          example: 2
        moodRate:
          type: integer
          example: 4
        stressLevel:
          type: integer
          example: 2
        effortRate:
          type: integer
          example: 7
        isSick:
          type: boolean
          example: false
        painZones:
          type: string
          nullable: true
          example: "Isquiotibial derecho"
        hasActiveInjury:
          type: boolean
          example: false
        injuries:
          type: array
          items:
            type: object
            properties:
              injuryId:
                type: string
                format: uuid
              zone:
                type: string
              level:
                type: integer
                minimum: 0
                maximum: 10

    DailyLoadActivity:
      type: object
      properties:
        minutes:
          type: integer
          minimum: 0
          example: 60
        rpe:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
          example: 7

    DailyLoadRequest:
      type: object
      properties:
        gym:
          $ref: '#/components/schemas/DailyLoadActivity'
        sportTraining:
          $ref: '#/components/schemas/DailyLoadActivity'
        match1:
          $ref: '#/components/schemas/DailyLoadActivity'
        match2:
          $ref: '#/components/schemas/DailyLoadActivity'
        individualWork:
          $ref: '#/components/schemas/DailyLoadActivity'

    DailyLoadResponse:
      type: object
      required:
        - message
        - totalMinutes
        - totalLoad
        - date
        - gym
        - sportTraining
        - match1
        - match2
        - individualWork
      properties:
        message:
          type: string
          example: "Carga del día registrada."
        totalMinutes:
          type: integer
          example: 60
        totalLoad:
          type: integer
          example: 420
        date:
          type: string
          format: date
          example: "2026-10-26"
        gym:
          $ref: '#/components/schemas/DailyLoadActivity'
        sportTraining:
          $ref: '#/components/schemas/DailyLoadActivity'
        match1:
          $ref: '#/components/schemas/DailyLoadActivity'
        match2:
          $ref: '#/components/schemas/DailyLoadActivity'
        individualWork:
          $ref: '#/components/schemas/DailyLoadActivity'

    AthleteWeekDay:
      type: object
      required:
        - date
        - dayOfWeek
        - completed
      properties:
        date:
          type: string
          format: date
          example: "2026-10-26"
        dayOfWeek:
          type: string
          example: "Monday"
        completed:
          type: boolean
          example: true

    AthleteWeek:
      type: object
      required:
        - weekStart
        - weekEnd
        - completedDays
        - days
      properties:
        weekStart:
          type: string
          format: date
          example: "2026-10-26"
        weekEnd:
          type: string
          format: date
          example: "2026-11-01"
        completedDays:
          type: array
          items:
            type: string
            format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/AthleteWeekDay'

    SetAttendanceRequest:
      type: object
      required:
        - present
      properties:
        present:
          type: boolean
          example: true

    CategoryAttendanceSummary:
      type: object
      required:
        - categoryId
        - date
        - totalRoster
        - presentCount
      properties:
        categoryId:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        date:
          type: string
          format: date
          example: "2026-10-10"
        totalRoster:
          type: integer
          example: 32
        presentCount:
          type: integer
          example: 29
        attendancePercentage:
          type: number
          format: double
          example: 90.6
        athletes:
          type: array
          items:
            $ref: '#/components/schemas/AthleteAttendanceSummary'

    AthleteAttendanceSummary:
      type: object
      required:
        - athleteId
        - athleteName
        - status
      properties:
        athleteId:
          type: string
          format: uuid
        athleteName:
          type: string
        status:
          type: string
          enum: [Present, NoRecord]

    AthleteTrafficLightSummary:
      type: object
      description: >
        Estado de bienestar diario del atleta para el semáforo consolidado de la categoría,
        con el desglose de indicadores del check-in para la visualización en la PWA (KAN-365).
      required:
        - athleteId
        - athleteName
        - trafficLight
        - hasReportedToday
        - resultValue
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        athleteName:
          type: string
          example: "Lucas Fernández"
        trafficLight:
          type: string
          enum: [Green, Yellow, Red]
          example: "Yellow"
        trafficLightReason:
          type: string
          nullable: true
          example: "Molestia muscular en rodilla reportada en check-in"
        hasReportedToday:
          type: boolean
          example: true
        reportedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-10T08:15:00Z"
        resultValue:
          type: integer
          enum: [20, 50, 90]
          description: Escala de severidad del motor del semáforo (Rojo 20, Amarillo 50, Verde 90).
          example: 50
        indicators:
          $ref: '#/components/schemas/TrafficLightIndicators'

    TrafficLightIndicators:
      type: object
      description: >
        Valores crudos del check-in de hoy que alimentan los indicadores individuales
        (sueño, esfuerzo, dolor, enfermedad, lesión) dentro de la card del semáforo.
        Ausente (null) cuando el atleta no reportó hoy.
      required:
        - sleepHours
        - sleepQuality
        - isSick
        - hasActiveInjury
      properties:
        sleepHours:
          type: number
          format: double
          minimum: 0
          maximum: 24
          description: >
            Horas de sueño guardadas: de 0 a 12 (decimales permitidos);
            13 significa "más de 12 horas" (valores mayores se guardan como 13).
          example: 6.5
        sleepQuality:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        effortRate:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          example: 8
        isSick:
          type: boolean
          example: false
        hasActiveInjury:
          type: boolean
          example: false
        painZones:
          type: string
          nullable: true
          description: Zonas de dolor del check-in como "muscleId:nivel" separadas por coma.
          example: "cuadriceps_derecho:3,espalda_baja:2"

    GroupBenchmarkResponse:
      type: object
      required:
        - athleteId
        - categoryId
        - metrics
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        categoryId:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        categoryName:
          type: string
          example: "Primera División"
        metrics:
          type: array
          items:
            type: object
            required:
              - dimension
              - athleteValue
            properties:
              dimension:
                type: string
                example: "1RM Sentadilla (kg)"
              athleteValue:
                type: number
                example: 140.0
              groupAverage:
                type: number
                nullable: true
                example: 125.5
              unit:
                type: string
                example: "kg"
              difference:
                type: number
                nullable: true
                example: 14.5
              percentageDifference:
                type: number
                nullable: true
                example: 11.5
              direction:
                type: string
                example: "HigherIsBetter"
              status:
                type: string
                example: "AboveAverage"
              isWeakestPoint:
                type: boolean
                example: false
              trend:
                type: string
                nullable: true
                example: "Superior al promedio (+11.5%)"

    AthleteEvolutionResponse:
      type: object
      description: Vista consolidada de curvas de evolución temporal del atleta para graficar.
      required:
        - athleteId
        - from
        - to
        - strength
        - fitnessTests
        - wellness
        - weeklyLoads
        - strengthUnavailable
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        from:
          type: string
          format: date
          example: "2026-08-01"
        to:
          type: string
          format: date
          example: "2026-11-01"
        strength:
          type: array
          description: Series de progresión de fuerza (1RM) agrupadas por ejercicio.
          items:
            $ref: '#/components/schemas/StrengthEvolutionSeries'
        fitnessTests:
          type: array
          description: Series de capacidades atléticas (salto, velocidad, etc.) agrupadas por test físico.
          items:
            $ref: '#/components/schemas/FitnessTestEvolutionSeries'
        wellness:
          $ref: '#/components/schemas/WellnessEvolution'
        weeklyLoads:
          type: array
          description: Series de carga semanal acumulada (lunes a domingo en hora de Argentina). Solo disponible para el Preparador Físico; para el atleta se devuelve un arreglo vacío.
          items:
            $ref: '#/components/schemas/WeeklyLoadEvolutionPoint'
        strengthUnavailable:
          type: boolean
          description: Indica si el servicio de Entrenamiento no estuvo disponible para consultar los récords (modo degradado).
          example: false

    StrengthEvolutionSeries:
      type: object
      required:
        - exerciseId
        - exerciseName
        - unit
        - points
      properties:
        exerciseId:
          type: string
          format: uuid
          example: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        exerciseName:
          type: string
          example: "Sentadilla Trasera"
        unit:
          type: string
          example: "kg"
        points:
          type: array
          items:
            $ref: '#/components/schemas/EvolutionDataPoint'

    FitnessTestEvolutionSeries:
      type: object
      required:
        - catalogTestId
        - testName
        - motorCapacity
        - unit
        - points
      properties:
        catalogTestId:
          type: string
          format: uuid
          example: "6f1d8b3a-2c4e-4f5a-9b7d-1e2f3a4b5c6d"
        testName:
          type: string
          example: "Salto Vertical CMJ"
        motorCapacity:
          type: string
          example: "Power"
        unit:
          type: string
          example: "cm"
        points:
          type: array
          items:
            $ref: '#/components/schemas/EvolutionDataPoint'

    EvolutionDataPoint:
      type: object
      required:
        - date
        - value
      properties:
        date:
          type: string
          format: date
          example: "2026-10-15"
        value:
          type: number
          format: double
          example: 45.5
        label:
          type: string
          nullable: true
          example: "45.5 cm"

    WellnessEvolution:
      type: object
      required:
        - fatiguePoints
        - dailyPoints
      properties:
        fatiguePoints:
          type: array
          description: Curva de progresión de niveles de fatiga día a día.
          items:
            $ref: '#/components/schemas/EvolutionDataPoint'
        dailyPoints:
          type: array
          description: Detalle completo de variables de wellness registradas día a día.
          items:
            $ref: '#/components/schemas/DailyWellnessPoint'

    DailyWellnessPoint:
      type: object
      required:
        - date
        - fatigueLevel
        - sleepHours
        - sleepQuality
        - muscleSoreness
        - moodRate
        - stressLevel
        - trafficLight
        - hasActiveInjury
      properties:
        date:
          type: string
          format: date
          example: "2026-10-15"
        fatigueLevel:
          type: integer
          example: 3
        sleepHours:
          type: number
          format: double
          example: 7.5
        sleepQuality:
          type: integer
          example: 4
        muscleSoreness:
          type: integer
          example: 2
        moodRate:
          type: integer
          example: 4
        stressLevel:
          type: integer
          example: 2
        trafficLight:
          type: string
          example: "Green"
        hasActiveInjury:
          type: boolean
          example: false

    WeeklyLoadEvolutionPoint:
      type: object
      required:
        - weekStartDate
        - weekEndDate
        - totalLoad
        - totalMinutes
      properties:
        weekStartDate:
          type: string
          format: date
          example: "2026-10-12"
        weekEndDate:
          type: string
          format: date
          example: "2026-10-18"
        totalLoad:
          type: integer
          description: Carga semanal acumulada (suma de minutos × RPE de todas las actividades). Las semanas sin actividad registrada se devuelven en 0.
          example: 1850
        totalMinutes:
          type: integer
          description: Minutos totales de actividad física en la semana.
          example: 320

    CreateInjuryRequest:
      type: object
      required:
        - zone
        - description
        - injuryDate
        - estimatedReturnDate
      properties:
        zone:
          type: string
          example: "isquiotibiales"
        description:
          type: string
          example: "Gradación 3 tras sprint."
        injuryDate:
          type: string
          format: date
          example: "2026-10-01"
        estimatedReturnDate:
          type: string
          format: date
          example: "2026-11-01"

    UpdateInjuryStatusRequest:
      type: object
      required:
        - newStatus
        - transitionNotes
      properties:
        newStatus:
          type: string
          enum: [Active, InRecovery, MedicallyCleared]
          example: "InRecovery"
        transitionNotes:
          type: string
          example: "Evolución favorable tras 5 días de kinesiología y movilidad."

    Injury:
      type: object
      required:
        - id
        - athleteId
        - zone
        - description
        - injuryDate
        - estimatedReturnDate
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "2c74a0e9-b5ef-4d32-9cb7-28045d6f83ab"
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        zone:
          type: string
          example: "isquiotibiales"
        description:
          type: string
          example: "Gradación 3 tras sprint."
        injuryDate:
          type: string
          format: date
          example: "2026-10-01"
        estimatedReturnDate:
          type: string
          format: date
          example: "2026-11-01"
        status:
          type: string
          enum: [Active, InRecovery, MedicallyCleared]
          example: "InRecovery"
        clearedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-11-05T00:00:00Z"
        peakPain:
          type: integer
          nullable: true
          minimum: 0
          maximum: 10
          example: 8
        createdAt:
          type: string
          format: date-time
          example: "2026-10-05T10:15:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-10T09:30:00Z"

    AthleteFitnessTest:
      type: object
      description: Resultado histórico de una prueba física de un atleta.
      required:
        - id
        - athleteId
        - catalogTestId
        - testName
        - motorCapacity
        - value
        - measurementUnit
        - attempt
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
          example: "6c24fcf8-0fb5-48b2-b01f-0e4c67eb2581"
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        catalogTestId:
          type: string
          format: uuid
          example: "6f1d8b3a-2c4e-4f5a-9b7d-1e2f3a4b5c6d"
        testName:
          type: string
          example: "Salto Vertical CMJ"
        motorCapacity:
          type: string
          example: "Power"
        value:
          type: number
          format: double
          example: 45.5
        measurementUnit:
          type: string
          example: "cm"
        attempt:
          type: integer
          example: 1
        recordedAt:
          type: string
          format: date-time
          example: "2026-10-15T14:30:00Z"

    FitnessTest:
      type: object
      required:
        - id
        - name
        - motorCapacity
        - measurementUnit
        - difficultyLevel
        - active
      properties:
        id:
          type: string
          format: uuid
          example: "6f1d8b3a-2c4e-4f5a-9b7d-1e2f3a4b5c6d"
        name:
          type: string
          example: "Salto Vertical CMJ"
        motorCapacity:
          $ref: '#/components/schemas/MotorCapacity'
        measurementUnit:
          type: string
          description: Unidad de medida del resultado del test.
          example: "cm"
        difficultyLevel:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel de dificultad del test (1 a 5).
          example: 3
        active:
          type: boolean
          description: Estado activo del test. El catálogo solo expone tests activos.
          example: true

    MotorCapacity:
      type: string
      description: Capacidades motoras estándar del catálogo de tests físicos.
      enum:
        - Strength
        - Velocity
        - Endurance
        - Power
        - Flexibility
        - Agility
        - Coordination
      example: "Power"

    ProblemDetails:
      type: object
      required:
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: "https://tools.ietf.org/html/rfc9110#section-15.5.1"
        title:
          type: string
          example: "Regla de negocio violada"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Una lesión activa no puede pasar directamente a Alta. Debe pasar primero por estado 'InRecovery'."
        instance:
          type: string
          example: "/api/v1/injuries/2c74a0e9-b5ef-4d32-9cb7-28045d6f83ab/status"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    CategoryAveragesResponse:
      type: object
      required:
        - categoryId
        - categoryName
        - athleteCount
        - weekStart
        - weekEnd
        - fitnessTests
        - wellnessMetrics
      properties:
        categoryId:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        categoryName:
          type: string
          example: "Sub 20"
        athleteCount:
          type: integer
          example: 18
        weekStart:
          type: string
          format: date
          example: "2026-10-26"
        weekEnd:
          type: string
          format: date
          example: "2026-11-01"
        fitnessTests:
          type: array
          items:
            $ref: '#/components/schemas/FitnessTestAverage'
        wellnessMetrics:
          type: array
          items:
            $ref: '#/components/schemas/WellnessMetricAverage'

    FitnessTestAverage:
      type: object
      required:
        - testId
        - testName
        - motorSkill
        - unit
        - average
        - testedAthleteCount
      properties:
        testId:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        testName:
          type: string
          example: "Salto Vertical CMJ"
        motorSkill:
          type: string
          example: "Power"
        unit:
          type: string
          example: "cm"
        average:
          type: number
          format: double
          example: 38.4
        testedAthleteCount:
          type: integer
          example: 15

    WellnessMetricAverage:
      type: object
      required:
        - metric
        - average
        - reportedAthleteCount
        - totalCheckIns
      properties:
        metric:
          type: string
          example: "Sleep"
        average:
          type: number
          format: double
          example: 7.6
        reportedAthleteCount:
          type: integer
          example: 14
        totalCheckIns:
          type: integer
          example: 42

    FieldTestSession:
      type: object
      description: Sesión de test de campo (KAN-425) con sus tests y resultados.
      required:
        - id
        - categoryId
        - date
        - name
        - status
        - tests
        - results
      properties:
        id:
          type: string
          format: uuid
          example: "6f9619ff-8b86-d011-b42d-00c04fc964ff"
        categoryId:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        date:
          type: string
          format: date
          example: "2026-11-04"
        name:
          type: string
          maxLength: 150
          example: "Evaluación de pretemporada"
        status:
          type: string
          enum:
            - Planned
            - InProgress
            - Closed
          example: "InProgress"
        tests:
          type: array
          description: Tests del catálogo de la sesión, en orden de evaluación.
          items:
            $ref: '#/components/schemas/FieldTestSessionTest'
        results:
          type: array
          description: Resultados cargados por los atletas.
          items:
            $ref: '#/components/schemas/FieldTestResult'

    FieldTestSessionTest:
      type: object
      description: Test del catálogo incluido en la sesión, con su orden de evaluación.
      required:
        - catalogTestId
        - order
      properties:
        catalogTestId:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        order:
          type: integer
          minimum: 1
          example: 1

    FieldTestResult:
      type: object
      description: Resultado de un atleta en un test de la sesión, con su intento.
      required:
        - id
        - catalogTestId
        - athleteId
        - value
        - attempt
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
          example: "a6a6f8a4-0a6c-4f5f-9a5a-1b2c3d4e5f60"
        catalogTestId:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        athleteId:
          type: string
          format: uuid
          example: "2c74a0e9-b5ef-4d32-9cb7-28045d6f83ab"
        value:
          type: number
          format: double
          example: 42.5
        attempt:
          type: integer
          minimum: 1
          example: 1
        recordedAt:
          type: string
          format: date-time
          example: "2026-11-04T15:30:00Z"

    CreateFieldTestResultRequest:
      type: object
      description: Carga rápida de un resultado de campo (KAN-425).
      required:
        - catalogTestId
        - athleteId
        - value
        - attempt
      properties:
        catalogTestId:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        athleteId:
          type: string
          format: uuid
          example: "2c74a0e9-b5ef-4d32-9cb7-28045d6f83ab"
        value:
          type: number
          format: double
          example: 42.5
        attempt:
          type: integer
          minimum: 1
          example: 1

    UpdateFieldTestResultRequest:
      type: object
      description: Corrección de un resultado de campo ya cargado (KAN-425).
      required:
        - value
        - attempt
      properties:
        value:
          type: number
          format: double
          example: 41.8
        attempt:
          type: integer
          minimum: 1
          example: 1

    FieldTestSessionSummary:
      type: object
      description: >
        Resumen de sesión de test de campo para el listado por categoría (KAN-427), sin
        tests ni resultados. El estado viaja como texto.
      required:
        - id
        - categoryId
        - date
        - name
        - status
      properties:
        id:
          type: string
          format: uuid
          example: "6f9619ff-8b86-d011-b42d-00c04fc964ff"
        categoryId:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        date:
          type: string
          format: date
          example: "2026-11-04"
        name:
          type: string
          maxLength: 150
          example: "Evaluación de pretemporada"
        status:
          type: string
          enum:
            - Planned
            - InProgress
            - Closed
          example: "Planned"

    CreateFieldTestSessionRequest:
      type: object
      description: >
        Alta de una sesión de test de campo (KAN-427): categoría del PF, fecha, nombre y
        pruebas del catálogo en orden de evaluación.
      required:
        - categoryId
        - date
        - name
        - tests
      properties:
        categoryId:
          type: string
          format: uuid
          description: Categoría del PF autenticado; si no existe o es de otra → 404.
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        date:
          type: string
          format: date
          example: "2026-11-04"
        name:
          type: string
          maxLength: 150
          example: "Evaluación de pretemporada"
        tests:
          type: array
          minItems: 1
          description: Pruebas del catálogo en el orden en que se evalúan; sin repetidos.
          items:
            $ref: '#/components/schemas/FieldTestSessionTestInput'

    FieldTestSessionTestInput:
      type: object
      description: Prueba del catálogo pedida al crear la sesión, con su orden.
      required:
        - catalogTestId
        - order
      properties:
        catalogTestId:
          type: string
          format: uuid
          description: Debe existir en el catálogo del PF; si no → 400.
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        order:
          type: integer
          minimum: 1
          example: 1

    UpdateFieldTestSessionStatusRequest:
      type: object
      description: >
        Avance de estado de la sesión (KAN-427): solo Planned -> InProgress -> Closed, en
        orden estricto. Un salto o una reapertura → 400.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - InProgress
            - Closed
          example: "InProgress"
