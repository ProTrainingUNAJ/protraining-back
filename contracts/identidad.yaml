openapi: 3.0.3
info:
  title: ProTraining - Microservicio de Identidad
  description: >
    API v1 para la gestión de autenticación, control de accesos (RBAC), emisión
    y rotación de tokens JWT Bearer para preparadores físicos (PF), atletas y tutores.
  version: 1.2.0
servers:
  - url: http://localhost:8081
    description: Entorno local / Docker Compose
  - url: http://identidad:8080
    description: Red interna de Docker entre microservicios

tags:
  - name: Authentication
    description: Endpoints para inicio de sesión y renovación de tokens
  - name: Health
    description: Monitoreo de disponibilidad del servicio y base de datos
  - name: Users
    description: Gestión del perfil y datos de usuarios


paths:
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Iniciar sesión en el sistema
      description: Valida credenciales de email y contraseña y emite un token JWT con la información del usuario autenticado.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Credenciales válidas. Devuelve el token JWT y los datos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: Credenciales inválidas (email inexistente o contraseña incorrecta).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/google:
    post:
      tags:
        - Authentication
      summary: Iniciar sesión con Google (KAN-541)
      description: Autentica únicamente a usuarios existentes que ya tengan su cuenta de Google vinculada explícitamente mediante Google Subject. No vincula automáticamente por correo ni realiza auto-registro.
      operationId: googleLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        "200":
          description: Autenticación exitosa. Devuelve el token JWT y los datos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: Token de Google inválido, expirado, cuenta no vinculada o no autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Correo de Preparador Físico pendiente de confirmación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/google/link:
    get:
      tags:
        - Authentication
      summary: Consultar estado de vinculación con Google (KAN-541)
      description: Indica si el usuario autenticado posee una cuenta de Google vinculada sin exponer el Google Subject.
      operationId: getGoogleLinkStatus
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Estado de vinculación obtenido correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLinkStatusResponse'
        "401":
          description: No autenticado o credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
        - Authentication
      summary: Vincular explícitamente cuenta de Google (KAN-541)
      description: Vincula una cuenta de Google verificada al usuario autenticado, exigiendo reautenticación con contraseña actual y coincidencia de correo.
      operationId: linkGoogleAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkGoogleAccountRequest'
      responses:
        "200":
          description: Cuenta de Google vinculada correctamente (idempotente si ya estaba vinculada al mismo Google Subject).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLinkStatusResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: No autenticado o credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Correo de Preparador Físico pendiente de confirmación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "409":
          description: La cuenta de Google ya está vinculada a otro usuario o el usuario ya tiene otra cuenta de Google vinculada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - Authentication
      summary: Desvincular cuenta de Google (KAN-541)
      description: Elimina la vinculación de Google del usuario autenticado tras reautenticar con su contraseña actual. No permite desvincular si no existe contraseña local.
      operationId: unlinkGoogleAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlinkGoogleAccountRequest'
      responses:
        "200":
          description: Cuenta de Google desvinculada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLinkStatusResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: No autenticado o credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Correo de Preparador Físico pendiente de confirmación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Renovar token de acceso
      description: Renueva el access token rotando el refresh token para el dispositivo indicado.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        "200":
          description: Token renovado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: Refresh token inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/register-by-invitation:
    post:
      tags:
        - Authentication
      summary: Registro de atleta por invitación
      description: Registra la cuenta de un nuevo atleta a partir de un token de invitación de categoría (KAN-397). Rechaza con 403 si el email ya existe con rol PreparadorFisico, responde 409 si ya existe como Atleta, y 410 o 400 si el token de invitación es inválido o venció.
      operationId: registerByInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterByInvitationRequest'
      responses:
        "200":
          description: Cuenta creada exitosamente. Devuelve el token JWT y los datos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          description: No se permite el registro. El usuario ya existe con rol PreparadorFisico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "409":
          description: Ya existe una cuenta de atleta registrada con este correo electrónico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "410":
          description: El enlace o código de invitación ha expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/register-pf:
    post:
      tags:
        - Authentication
      summary: Registro independiente de Preparador Físico (KAN-601)
      description: Registra la cuenta de un nuevo preparador físico y despacha un correo con enlace de confirmación. Responde 409 si el email ya existe.
      operationId: registerPf
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPfRequest'
      responses:
        "201":
          description: Preparador físico registrado exitosamente. Correo de confirmación enviado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPfResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          description: Ya existe una cuenta registrada con este correo electrónico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/confirm-email:
    post:
      tags:
        - Authentication
      summary: Confirmación de correo electrónico (KAN-601)
      description: Activa el correo de la cuenta utilizando el token recibido por email para habilitar el inicio de sesión del PF.
      operationId: confirmEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
      responses:
        "200":
          description: Correo confirmado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmEmailResponse'
        "400":
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/resend-confirmation:
    post:
      tags:
        - Authentication
      summary: Reenviar correo de confirmación de cuenta (KAN-601)
      description: Reenvía el correo de confirmación de cuenta de forma anti-enumeración.
      operationId: resendConfirmation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendConfirmationRequest'
      responses:
        "202":
          description: Solicitud recibida. Si la cuenta existe y está pendiente, se envía el correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendConfirmationResponse'
        "400":
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Solicitar recuperación de contraseña por correo electrónico
      description: >
        Envía un correo con un enlace y token de recuperación si el usuario existe.
        Para prevenir la enumeración de cuentas, siempre devuelve HTTP 202 Accepted.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        "202":
          description: Solicitud aceptada. Mensaje genérico de confirmación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        "400":
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Restablecer contraseña mediante token de recuperación
      description: >
        Restablece la contraseña de la cuenta validando el token de recuperación recibido por correo.
        Aplica la política unificada de contraseñas, revoca las sesiones activas anteriores e invalida los JWT emitidos.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        "200":
          description: Contraseña restablecida exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        "400":
          description: Token inválido, vencido o contraseña que no cumple la política.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Cambiar contraseña de usuario autenticado
      description: >
        Permite a un usuario autenticado cambiar su contraseña validando la contraseña actual
        y verificando las reglas de seguridad de la nueva contraseña. Revoca todos los refresh tokens
        activos del usuario para cerrar las sesiones abiertas.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        "204":
          description: Contraseña actualizada correctamente y sesiones activas revocadas.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: No autenticado o credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/athletes/{athleteId}/reset-password:
    post:
      tags:
        - Authentication
      summary: Resetear contraseña de un atleta (exclusivo para Preparador Físico)
      description: >
        Permite a un Preparador Físico restablecer la contraseña de un atleta a su cargo.
        Genera una contraseña temporal segura, revoca todos los refresh tokens del atleta
        y marca la cuenta para cambio obligatorio en el próximo inicio de sesión.
      operationId: resetAthletePassword
      security:
        - BearerAuth: []
      parameters:
        - name: athleteId
          in: path
          required: true
          description: Identificador único del atleta a resetear.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Contraseña temporal generada exitosamente.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store, no-cache"
            Pragma:
              schema:
                type: string
                example: "no-cache"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetAthletePasswordResponse'
        "401":
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Requiere rol PreparadorFisico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: Atleta no encontrado o no pertenece al Preparador Físico autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/me/profile:
    put:
      tags:
        - Users
      summary: Actualizar perfil de Preparador Físico (KAN-601)
      description: Actualiza nombre completo y teléfono normalizado del preparador físico autenticado.
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        "200":
          description: Perfil actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: No autenticado o token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Requiere rol PreparadorFisico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/me/habits-recommendations:
    get:
      tags:
        - Users
      summary: Obtener la preferencia de recomendaciones de hábitos del PF autenticado (KAN-493)
      description: >
        Devuelve si el preparador físico autenticado tiene habilitadas las recomendaciones
        de hábitos y alimentación para sus atletas. El valor predeterminado es true.
      operationId: getMyHabitsRecommendations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Preferencia actual del preparador físico autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitsRecommendationsStatus'
        "401":
          description: No autenticado o token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Requiere rol PreparadorFisico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
        - Users
      summary: Actualizar la preferencia de recomendaciones de hábitos del PF autenticado (KAN-493)
      description: >
        Activa o desactiva las recomendaciones de hábitos y alimentación para todos los atletas
        del preparador físico autenticado. La restricción se aplica en el backend del Asistente.
      operationId: updateMyHabitsRecommendations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHabitsRecommendationsRequest'
      responses:
        "200":
          description: Preferencia actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitsRecommendationsStatus'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: No autenticado o token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Requiere rol PreparadorFisico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/me/pf-habits-recommendations:
    get:
      tags:
        - Users
      summary: Obtener la preferencia de recomendaciones del PF del atleta autenticado (KAN-493)
      description: >
        Devuelve si el preparador físico asignado al atleta autenticado habilitó las
        recomendaciones de hábitos y alimentación. El PF se resuelve desde el claim pf_id del token.
      operationId: getAthletePfHabitsRecommendations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Preferencia del preparador físico del atleta autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitsRecommendationsStatus'
        "401":
          description: No autenticado, token inválido o token sin preparador físico asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Requiere rol Atleta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: No se encontró el preparador físico del atleta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/me/telegram:
    put:
      tags:
        - Users
      summary: Actualizar usuario de Telegram propio (PF y Atleta, KAN-503)
      description: >
        Actualiza exclusivamente el usuario de Telegram del usuario autenticado (PF o Atleta).
        Para atletas, sincroniza primero con Estructura antes de confirmar el cambio en Identidad.
      operationId: updateMyUserTelegram
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTelegramRequest'
      responses:
        "200":
          description: Usuario de Telegram actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: No autenticado o token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Rol no permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: Atleta no encontrado en Estructura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "503":
          description: No se pudo sincronizar el usuario de Telegram con Estructura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/me/deactivate:
    post:
      tags:
        - Users
      summary: Baja lógica de cuenta del Preparador Físico (KAN-601)
      description: Da de baja la cuenta del preparador físico, validando la contraseña actual y revocando todas las sesiones activas.
      operationId: deactivateAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateAccountRequest'
      responses:
        "204":
          description: Cuenta dada de baja exitosamente y sesiones revocadas.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: No autenticado o contraseña incorrecta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Requiere rol PreparadorFisico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/me/phone:
    put:
      tags:
        - Users
      summary: Actualizar teléfono de WhatsApp del usuario
      description: Solo para el rol PreparadorFisico. Actualiza y normaliza el número de WhatsApp de la cuenta del token (claim `sub`). Responde 400 con mensaje en español si el formato es inválido y 403 si el token es de un atleta.
      operationId: updateWhatsAppPhone
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePhoneRequest'
      responses:
        "200":
          description: Teléfono de WhatsApp actualizado y normalizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePhoneResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: No autenticado o token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: El token no es de un preparador físico (por ejemplo, el de un atleta).

  /api/v1/users/me/pf-contact:
    get:
      tags:
        - Users
      summary: Obtener el WhatsApp del preparador físico del atleta
      description: Solo para el rol Atleta. Devuelve el número de WhatsApp de su preparador físico, tomado del claim `pf_id` del token, así que no se puede pedir el de otro PF. Responde 404 si el PF todavía no cargó su número.
      operationId: getPfContact
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Número de WhatsApp del preparador físico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PfContact'
        "401":
          description: No autenticado o token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: El token no es de un atleta.
        "404":
          description: El preparador físico todavía no cargó su número de WhatsApp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/me/photo:
    put:
      tags:
        - Users
      summary: Cargar o actualizar foto de perfil del usuario
      description: Sube una foto en formato WebP (máx. 200 KB) para el usuario autenticado.
      operationId: uploadMyPhoto
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                  description: Archivo de imagen en formato WebP.
              required:
                - photo
      responses:
        "204":
          description: Foto actualizada correctamente.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: No autenticado.
    get:
      tags:
        - Users
      summary: Obtener foto de perfil del usuario autenticado
      description: Retorna la imagen WebP de perfil del usuario autenticado con encabezados de caché del navegador.
      operationId: getMyPhoto
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Imagen en formato WebP.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: No autenticado.
        "404":
          description: El usuario no tiene foto de perfil.
    delete:
      tags:
        - Users
      summary: Eliminar foto de perfil del usuario autenticado
      description: Elimina la foto de perfil del usuario autenticado.
      operationId: deleteMyPhoto
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Foto eliminada correctamente.
        "401":
          description: No autenticado.

  /api/v1/users/{id}/photo:
    get:
      tags:
        - Users
      summary: Obtener foto de perfil de un usuario
      description: Retorna la imagen WebP de perfil de un usuario por su identificador.
      operationId: getUserPhoto
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Imagen en formato WebP.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: El usuario no tiene foto de perfil.

  /api/v1/users/me/pf-photo:
    get:
      tags:
        - Users
      summary: Obtener la foto de perfil del preparador físico del atleta
      description: Solo para el rol Atleta. Devuelve la foto de perfil en formato WebP de su preparador físico.
      operationId: getMyPfPhoto
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Imagen en formato WebP.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: No autenticado.
        "403":
          description: El token no es de un atleta.
        "404":
          description: El preparador físico no tiene foto de perfil.

  /api/health:
    get:
      tags:
        - Health
      summary: Chequeo de salud del servicio
      description: Comprueba que el microservicio esté activo y que la conexión con su base de datos PostgreSQL sea correcta.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Servicio saludable y base de datos conectada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        "503":
          description: Base de datos inaccesible o falla crítica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  responses:
    BadRequest:
      description: Solicitud con datos inválidos o formato erróneo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'


  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT Bearer emitido por este microservicio.

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
        - deviceId
      properties:
        email:
          type: string
          format: email
          example: "julian@protraining.com"
        password:
          type: string
          format: password
          example: "PasswordSegura123!"
        deviceId:
          type: string
          description: Identificador del dispositivo cliente para vinculación de sesión y emisión de refresh token.
          example: "device-web-pwa-01"
    GoogleLoginRequest:
      type: object
      required:
        - idToken
      properties:
        idToken:
          type: string
          description: ID Token criptográfico emitido por Google Identity Services.
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjEyMzQ1NiJ9..."
        deviceId:
          type: string
          description: Identificador del dispositivo cliente para vinculación de sesión y emisión de refresh token.
          example: "device-web-pwa-01"
    LinkGoogleAccountRequest:
      type: object
      required:
        - idToken
        - currentPassword
      properties:
        idToken:
          type: string
          description: ID Token criptográfico emitido por Google Identity Services.
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjEyMzQ1NiJ9..."
        currentPassword:
          type: string
          format: password
          description: Contraseña actual del usuario en ProTraining requerida como reautenticación.
          example: "PasswordSegura123!"
    UnlinkGoogleAccountRequest:
      type: object
      required:
        - currentPassword
      properties:
        currentPassword:
          type: string
          format: password
          description: Contraseña actual del usuario en ProTraining requerida como reautenticación.
          example: "PasswordSegura123!"
    GoogleLinkStatusResponse:
      type: object
      required:
        - googleLinked
      properties:
        googleLinked:
          type: boolean
          description: Indica si la cuenta autenticada tiene Google vinculado.
          example: true
    RegisterByInvitationRequest:
      type: object
      required:
        - email
        - password
        - fullName
        - token
      properties:
        email:
          type: string
          format: email
          example: "atleta.nuevo@protraining.com"
        password:
          type: string
          format: password
          example: "PasswordSegura123!"
        fullName:
          type: string
          example: "Mateo Fernández"
        token:
          type: string
          description: Token de invitación de la categoría (emitido por Estructura).
          example: "e3b0c44298fc1c149afbf4c8996fb924"
        deviceId:
          type: string
          nullable: true
          description: Identificador del dispositivo cliente (opcional).
          example: "device-web-pwa-01"        

    User:
      type: object
      description: Información del usuario autenticado.
      required:
        - id
        - email
        - fullName
        - role
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        email:
          type: string
          format: email
          example: "julian@protraining.com"
        fullName:
          type: string
          example: "Prof. Julián Antúnez"
        role:
          type: string
          enum: [PreparadorFisico, Atleta, Tutor]
          description: Rol asignado en el sistema (excepción de dominio en español).
          example: "PreparadorFisico"
        pfId:
          type: string
          format: uuid
          nullable: true
          description: Identificador del preparador físico asignado (excepción de dominio en español).
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        phoneNumber:
          type: string
          nullable: true
          description: Número de teléfono de WhatsApp normalizado (solo dígitos).
          example: "5491123456789"
        telegramUsername:
          type: string
          nullable: true
          description: Username de Telegram normalizado (sin @).
          example: "profe_juan"
        mustChangePassword:
          type: boolean
          description: Indica si el usuario debe cambiar obligatoriamente su contraseña antes de acceder a la aplicación.
          example: false


    LoginResponse:
      type: object
      description: Respuesta devuelta tras un inicio de sesión exitoso.
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: Token de acceso JWT emitido.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: Token de actualización para rotar la sesión sin reautenticar.
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        tokenType:
          type: string
          description: Tipo de esquema del token de autenticación.
          example: "Bearer"
        expiresIn:
          type: integer
          description: Segundos de vigencia del token de acceso.
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          description: Contraseña actual del usuario.
          example: "ContraseñaActual123!"
        newPassword:
          type: string
          description: Nueva contraseña (mínimo 8 caracteres, al menos una mayúscula y un carácter especial).
          example: "ContraseñaNueva456!"

    ResetAthletePasswordResponse:
      type: object
      required:
        - athleteId
        - temporaryPassword
        - mustChangePassword
      properties:
        athleteId:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e"
        temporaryPassword:
          type: string
          description: Contraseña temporal generada que debe ser entregada al atleta.
          example: "Xk9#mP2$vL8q"
        mustChangePassword:
          type: boolean
          description: Flag que indica que el atleta debe cambiar su contraseña al iniciar sesión.
          example: true

    RefreshRequest:
      type: object
      required:
        - refreshToken
        - deviceId
      properties:
        refreshToken:
          type: string
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        deviceId:
          type: string
          example: "device-web-pwa-01"

    RefreshResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          example: 3600

    UpdatePhoneRequest:
          type: object
          required:
            - phoneNumber
          properties:
            phoneNumber:
              type: string
              description: Número de teléfono de WhatsApp con código de país.
              example: "+54 9 11 2345-6789"

    UpdatePhoneResponse:
      type: object
      required:
        - phoneNumber
      properties:
        phoneNumber:
          type: string
          description: Número de teléfono normalizado en estándar E.164 (solo dígitos).
          example: "5491123456789"
          
    PfContact:
      type: object
      properties:
        phoneNumber:
          type: string
          nullable: true
          description: Número de WhatsApp del preparador físico (solo dígitos, con código de país).
          example: "5491123456789"
        telegramUsername:
          type: string
          nullable: true
          description: Username de Telegram del preparador físico (sin @, entre 5 y 32 caracteres).
          example: "profe_juan"

    

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "usuario@protraining.app"

    ForgotPasswordResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Si el correo está registrado, recibirás un enlace para recuperar tu contraseña."

    ResetPasswordRequest:
      type: object
      required:
        - email
        - token
        - newPassword
      properties:
        email:
          type: string
          format: email
          example: "usuario@protraining.app"
        token:
          type: string
          description: Token de recuperación generado por ASP.NET Core Identity.
          example: "CfDJ8N3z...=="
        newPassword:
          type: string
          format: password
          description: Nueva contraseña (mínimo 8 caracteres y al menos un número).
          example: "NuevaPassword123"

    ResetPasswordResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Contraseña actualizada exitosamente."

    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "Healthy"
        database:
          type: string
          example: "Connected"

    ProblemDetails:
      type: object
      required:
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: "https://tools.ietf.org/html/rfc9110#section-15.5.5"
        title:
          type: string
          example: "Error de solicitud"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Las credenciales ingresadas son incorrectas."
        instance:
          type: string
          example: "/api/v1/auth/login"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ["El email no tiene un formato válido."]

    RegisterPfRequest:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan.perez@protraining.com"
        password:
          type: string
          format: password
          example: "PasswordSegura123!"
        phone:
          type: string
          nullable: true
          example: "+54 9 11 1234-5678"
        deviceId:
          type: string
          nullable: true
          example: "device-web-pwa-01"

    RegisterPfResponse:
      type: object
      required:
        - id
        - email
        - fullName
        - message
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        message:
          type: string
          example: "Registro exitoso. Se ha enviado un correo con instrucciones para activar la cuenta."

    ConfirmEmailRequest:
      type: object
      required:
        - userId
        - token
      properties:
        userId:
          type: string
          format: uuid
        token:
          type: string

    ConfirmEmailResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Correo electrónico confirmado exitosamente. Ya podés iniciar sesión."

    ResendConfirmationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "juan.perez@protraining.com"

    ResendConfirmationResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Si la cuenta existe y está pendiente de confirmación, se ha enviado un nuevo correo de activación."

    UpdateProfileRequest:
      type: object
      required:
        - fullName
      properties:
        fullName:
          type: string
          example: "Juan Pérez Modificado"
        phone:
          type: string
          nullable: true
          example: "+54 9 11 9988-7766"
        telegramUsername:
          type: string
          nullable: true
          example: "profe_juan"

    UpdateTelegramRequest:
      type: object
      properties:
        telegramUsername:
          type: string
          nullable: true
          example: "lucas_atleta"

    ProfileResponse:
      type: object
      required:
        - id
        - email
        - fullName
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
          example: "5491199887766"
        telegramUsername:
          type: string
          nullable: true
          example: "profe_juan"

    DeactivateAccountRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          example: "PasswordSegura123!"

    HabitsRecommendationsStatus:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          example: true

    UpdateHabitsRecommendationsRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          example: false
