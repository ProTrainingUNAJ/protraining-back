openapi: 3.0.3
info:
  title: ProTraining - Microservicio de Estructura
  description: >
    API v1 para la administración de organizaciones deportivas (clubes),
    categorías, fixture de temporada y padrón de atletas con ficha médica,
    contacto de emergencia y consentimiento de tutor para menores de edad.
  version: 1.2.0
servers:
  - url: http://localhost:8082
    description: Entorno local / Docker Compose
  - url: http://estructura:8080
    description: Red interna de Docker entre microservicios

security:
  - BearerAuth: []

tags:
  - name: Athletes
    description: Padrón de deportistas, ficha médica, consentimiento de tutor y vinculación a categorías
  - name: Organizations
    description: Gestión de clubes u organizaciones deportivas del preparador físico
  - name: Categories
    description: Divisiones deportivas y calendario de partidos de la temporada
  - name: Health
    description: Monitoreo de disponibilidad del servicio y base de datos

paths:
  /api/v1/athletes:
    get:
      tags:
        - Athletes
      summary: Listar atletas
      description: Retorna el plantel de atletas pertenecientes a las organizaciones del preparador físico.
      operationId: listAthletes
      responses:
        "200":
          description: Lista de atletas obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Athlete'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Athletes
      summary: Registrar nuevo atleta
      description: Da de alta un deportista registrando sus datos personales, información médica y consentimiento parental si es menor.
      operationId: createAthlete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAthleteRequest'
      responses:
        "201":
          description: Atleta registrado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/athletes/{id}:
    get:
      tags:
        - Athletes
      summary: Obtener detalle de un atleta
      description: Retorna la ficha completa del deportista, incluyendo datos de contacto y consentimiento de tutor si aplica.
      operationId: getAthlete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Atleta encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Athletes
      summary: Actualizar ficha del atleta
      description: Actualiza los datos de contacto, contacto de emergencia o condiciones médicas del atleta.
      operationId: updateAthlete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAthleteRequest'
      responses:
        "200":
          description: Ficha actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Athletes
      summary: Dar de baja lógica a un atleta
      description: Marca al deportista como eliminado (borrado lógico) preservando la integridad de datos históricos.
      operationId: deleteAthlete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Atleta eliminado correctamente.
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{id}/habits-permission:
    patch:
      tags:
        - Athletes
      summary: Actualizar permiso de recomendaciones de hábitos
      description: Habilita o deshabilita la recepción de recomendaciones de hábitos y alimentación para el deportista.
      operationId: updateHabitsPermission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHabitsPermissionRequest'
      responses:
        "200":
          description: Permiso actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{id}/categories:
    get:
      tags:
        - Athletes
      summary: Listar categorías de un atleta
      description: Retorna las divisiones deportivas a las que está asignado el atleta.
      operationId: listCategoriesByAthlete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de categorías obtenida.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{id}/categories/{categoryId}:
    post:
      tags:
        - Athletes
      summary: Asignar atleta a una categoría
      description: Asocia al deportista al plantel de la categoría especificada.
      operationId: assignCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Asignación completada con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Athletes
      summary: Desvincular atleta de una categoría
      description: Quita la asignación del deportista en la categoría deportiva.
      operationId: removeCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Desvinculación exitosa.
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{id}/invitation:
    get:
      tags:
        - Athletes
      summary: Generar enlace de invitación para el atleta
      description: Emite un enlace único para que el deportista configure su acceso a la PWA móvil.
      operationId: generateAthleteInvitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Enlace de invitación generado con éxito.
          content:
            application/json:
              schema:
                type: object
                required:
                  - invitationUrl
                  - expiresAt
                properties:
                  invitationUrl:
                    type: string
                    example: "https://protraining.app/invite/a9f8c12e-3d4b-5c6a"
                  expiresAt:
                    type: string
                    format: date-time
                    example: "2026-10-19T23:59:59Z"
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations:
    get:
      tags:
        - Organizations
      summary: Listar organizaciones
      description: Obtiene los clubes u organizaciones deportivas gestionadas por el preparador físico autenticado.
      operationId: listOrganizations
      responses:
        "200":
          description: Lista de organizaciones recuperada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Organizations
      summary: Crear organización
      description: Registra una nueva entidad o club deportivo para el preparador físico.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        "201":
          description: Organización creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/organizations/{id}:
    get:
      tags:
        - Organizations
      summary: Obtener detalle de una organización
      description: Retorna la información de la organización deportiva.
      operationId: getOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organización encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Organizations
      summary: Actualizar organización
      description: Modifica el nombre o descripción de la organización.
      operationId: updateOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        "200":
          description: Organización actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Organizations
      summary: Eliminar organización
      description: Realiza el borrado lógico de la organización y sus dependencias.
      operationId: deleteOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Organización eliminada.
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/categories:
    get:
      tags:
        - Categories
      summary: Listar categorías
      description: Obtiene las divisiones deportivas registradas bajo una organización específica.
      operationId: listCategories
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de la organización para filtrar.
      responses:
        "200":
          description: Lista de categorías obtenida.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Categories
      summary: Crear categoría
      description: Agrega una nueva división o plantel a la organización deportiva.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        "201":
          description: Categoría creada con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/categories/{id}:
    get:
      tags:
        - Categories
      summary: Obtener detalle de una categoría
      description: Retorna la información de una división deportiva específica.
      operationId: getCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Categoría encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Categories
      summary: Actualizar categoría
      description: Modifica el nombre o descripción de la categoría.
      operationId: updateCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        "200":
          description: Categoría actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Categories
      summary: Eliminar categoría
      description: Da de baja lógica una división deportiva.
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Categoría eliminada con éxito.
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/categories/{id}/matches:
    get:
      tags:
        - Categories
      summary: Listar partidos de la temporada para una categoría
      description: Recupera el fixture de competencias de la división. Permite al Asistente anticipar alertas de sobrecarga.
      operationId: listCategoryMatches
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Calendario de partidos obtenido con éxito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Categories
      summary: Programar partido en el fixture
      description: Registra una nueva fecha competitiva para la división.
      operationId: createCategoryMatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchRequest'
      responses:
        "201":
          description: Partido programado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/health:
    get:
      tags:
        - Health
      summary: Chequeo de salud del servicio
      security: []
      operationId: healthCheck
      responses:
        "200":
          description: Servicio saludable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Healthy"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Solicitud con datos inválidos o formato erróneo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Token JWT ausente, vencido o no válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    GuardianConsent:
      type: object
      description: Registro de consentimiento parental obligatorio para atletas menores.
      required:
        - isSigned
        - consentDate
        - isMinor
        - allowsPhysicalTraining
        - allowsHabitsRecommendations
      properties:
        isSigned:
          type: boolean
          example: true
        consentDate:
          type: string
          format: date-time
          example: "2026-03-01T14:00:00Z"
        isMinor:
          type: boolean
          example: true
        guardianName:
          type: string
          nullable: true
          example: "Roberto Fernández"
        guardianEmail:
          type: string
          format: email
          nullable: true
          example: "roberto.fernandez@email.com"
        guardianPhone:
          type: string
          nullable: true
          example: "+54 11 4444-1234"
        allowsPhysicalTraining:
          type: boolean
          example: true
        allowsHabitsRecommendations:
          type: boolean
          example: false

    Athlete:
      type: object
      description: Objeto de atleta en concordancia con el DTO implementado en el backend.
      required:
        - id
        - firstName
        - lastName
        - fullName
        - email
        - phone
        - isMinor
        - active
        - allowsHabitsRecommendations
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        accountId:
          type: string
          format: uuid
          nullable: true
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        firstName:
          type: string
          example: "Lucas"
        lastName:
          type: string
          example: "Fernández"
        fullName:
          type: string
          example: "Lucas Fernández"
        email:
          type: string
          format: email
          example: "lucas.fernandez@club.com"
        phone:
          type: string
          example: "+54 11 5555-1234"
        isMinor:
          type: boolean
          example: false
        emergencyContact:
          type: string
          nullable: true
          example: "María Fernández - +54 11 4444-9876"
        medicalConditions:
          type: string
          nullable: true
          example: "Sin antecedentes patológicos relevantes"
        active:
          type: boolean
          example: true
        allowsHabitsRecommendations:
          type: boolean
          example: true
        guardianConsent:
          $ref: '#/components/schemas/GuardianConsent'

    CreateAthleteRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - isMinor
        - allowsPhysicalTraining
        - allowsHabitsRecommendations
      properties:
        firstName:
          type: string
          example: "Lucas"
        lastName:
          type: string
          example: "Fernández"
        email:
          type: string
          format: email
          example: "lucas.fernandez@club.com"
        phone:
          type: string
          example: "+54 11 5555-1234"
        isMinor:
          type: boolean
          example: false
        guardianName:
          type: string
          nullable: true
          example: "Roberto Fernández"
        guardianEmail:
          type: string
          format: email
          nullable: true
          example: "roberto.fernandez@email.com"
        guardianPhone:
          type: string
          nullable: true
          example: "+54 11 4444-1234"
        allowsPhysicalTraining:
          type: boolean
          example: true
        allowsHabitsRecommendations:
          type: boolean
          example: false
        emergencyContact:
          type: string
          nullable: true
          example: "Madre: +54 11 4444-9876"
        medicalConditions:
          type: string
          nullable: true
          example: "Apto médico presentado marzo 2026."

    UpdateAthleteRequest:
      type: object
      properties:
        phone:
          type: string
          example: "+54 11 5555-9999"
        emergencyContact:
          type: string
          example: "Padre: +54 11 2222-3333"
        medicalConditions:
          type: string
          example: "Actualización médica: asmático leve."

    UpdateHabitsPermissionRequest:
      type: object
      required:
        - allowsHabitsRecommendations
      properties:
        allowsHabitsRecommendations:
          type: boolean
          example: true

    Organization:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        name:
          type: string
          example: "Club Atlético ProTraining"
        description:
          type: string
          nullable: true
          example: "Sede central de entrenamiento deportivo"

    CreateOrganizationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Club Atlético ProTraining"
        description:
          type: string
          nullable: true
          example: "Sede central"

    UpdateOrganizationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Club Atlético ProTraining Actualizado"
        description:
          type: string
          nullable: true
          example: "Sede central ampliada"

    Category:
      type: object
      required:
        - id
        - organizationId
        - name
        - athletesCount
      properties:
        id:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        organizationId:
          type: string
          format: uuid
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        name:
          type: string
          example: "Primera División"
        description:
          type: string
          nullable: true
          example: "Plantel superior competitivo"
        athletesCount:
          type: integer
          example: 28

    CreateCategoryRequest:
      type: object
      required:
        - organizationId
        - name
      properties:
        organizationId:
          type: string
          format: uuid
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        name:
          type: string
          example: "Juveniles M19"
        description:
          type: string
          nullable: true
          example: "Categoría de formación competitiva"

    UpdateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Juveniles M19 A"
        description:
          type: string
          nullable: true
          example: "División A"

    Match:
      type: object
      required:
        - id
        - categoryId
        - opponent
        - matchDate
        - homeOrAway
      properties:
        id:
          type: string
          format: uuid
          example: "f1a2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c"
        categoryId:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        opponent:
          type: string
          example: "Club San Martín"
        matchDate:
          type: string
          format: date-time
          example: "2026-10-17T15:30:00Z"
        homeOrAway:
          type: string
          enum: [Home, Away, Neutral]
          example: "Home"
        notes:
          type: string
          nullable: true
          example: "Fecha 8 del torneo oficial"

    CreateMatchRequest:
      type: object
      required:
        - opponent
        - matchDate
        - homeOrAway
      properties:
        opponent:
          type: string
          example: "Club San Martín"
        matchDate:
          type: string
          format: date-time
          example: "2026-10-17T15:30:00Z"
        homeOrAway:
          type: string
          enum: [Home, Away, Neutral]
          example: "Home"
        notes:
          type: string
          nullable: true
          example: "Fecha 8"

    ProblemDetails:
      type: object
      required:
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: "https://tools.ietf.org/html/rfc9110#section-15.5.5"
        title:
          type: string
          example: "No encontrado"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "El atleta no existe o no pertenece a tu organización."
        instance:
          type: string
          example: "/api/v1/athletes/3fa85f64-5717-4562-b3fc-2c963f66afa6"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
