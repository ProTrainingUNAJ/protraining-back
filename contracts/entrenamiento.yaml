          format: uuid
          example: "b501d51c-4b53-4dc9-985f-8646f9037cfa"
        weightUsedKg:
          type: number
          format: double
          minimum: 1
          example: 120.0
        repsPerformed:
          type: integer
          minimum: 1
          example: 6

    LogExecutionResponse:
      type: object
      required:
        - weightUsedKg
        - repsPerformed
        - estimated1RmEpley
        - recordUpdated
        - message
      properties:
        weightUsedKg:
          type: number
          format: double
          example: 120.0
        repsPerformed:
          type: integer
          example: 6
        estimated1RmEpley:
          type: number
          format: double
          description: Estimación teórica de 1RM aplicando fórmula de Epley.
          example: 144.0
        previous1Rm:
          type: number
          format: double
          example: 140.0
        recordUpdated:
          type: boolean
          description: True si la nueva marca superó el récord anterior y fue consolidada.
          example: true
        message:
          type: string
          example: "¡Nuevo récord estimado de 144 kg según fórmula Epley!"

