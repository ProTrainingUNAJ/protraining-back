          type: array
          items:
            $ref: '#/components/schemas/RoutineItemRequest'

    TodayRoutineExercise:
      type: object
      required:
        - name
        - sets
        - reps
        - isReference
      properties:
        exerciseId:
          type: string
          format: uuid
          example: "b501d51c-4b53-4dc9-985f-8646f9037cfa"
        name:
          type: string
          example: "Sentadilla Trasera"
        muscleGroup:
          type: string
          example: "Piernas"
        videoUrl:
          type: string
          nullable: true
          example: "https://www.youtube.com/watch?v=aclHkVaku9U"
        images:
          type: array
          description: Fotos del ejercicio (inicio y fin del movimiento), las mismas que la biblioteca.
          items:
            type: string
          example: ["https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Squat/0.jpg"]
        primaryMuscles:
          type: array
          items:
            type: string
          description: Grupos musculares principales involucrados en la ejecución.
          example: ["Piernas", "Glúteos"]
        secondaryMuscles:
          type: array
          items:
            type: string
          description: Músculos secundarios o estabilizadores involucrados.
          example: ["Isquiotibiales", "Zona Lumbar"]
        sets:
          type: integer
          example: 4
        reps:
          type: integer
          example: 6
        percentage:
          type: number
          format: double
          example: 80.0
        weightKg:
          type: number
          format: double
          nullable: true
          description: Peso prescrito resuelto en kg (redondeado a múltiplos de 2.5 kg). Es null en series de referencia sin récord previo.
          example: 112.5
        barWeight:
          type: number
          format: double
          nullable: true
          description: Peso de la barra en kg (por defecto 20 kg en ejercicios con barra). Es null en ejercicios sin barra.
          example: 20.0
        weightPerSide:
          type: number
          format: double
          nullable: true
          description: Peso a colocar por cada lado de la barra en kg. Es 0 si el peso total es menor o igual a la barra ("solo la barra") y null si el ejercicio no es con barra.
          example: 46.25
        current1RmKg:
          type: number
          format: double
          nullable: true
          description: Marca 1RM vigente tomada como referencia para el cálculo. Es null si el atleta no tiene récord.
          example: 140.0
        isReference:
          type: boolean
          description: True si el ejercicio no tiene récord previo y la serie se prescribe como de referencia para probar y registrar.
          example: false

    TodayRoutineResponse:
      type: object
      required:
        - date
        - exercises
      properties:
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        athleteName:
          type: string
          example: "Lucas Fernández"
        date:
          type: string
          format: date
          example: "2026-10-10"
        hasActiveInjuries:
          type: boolean
          example: false
        routineAdapted:
          type: boolean
          description: Indica si el copiloto adaptó ejercicios hoy debido a molestias o dolores marcados en el check-in.
          example: false
        coachNotes:
          type: string
          nullable: true
          description: Indicaciones o notas del preparador físico asociadas a la sesión.
          example: "Controlar técnica en descenso y mantener pausa de 1 segundo."
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/TodayRoutineExercise'

