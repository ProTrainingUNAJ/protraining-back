openapi: 3.0.3
info:
  title: ProTraining - Microservicio de Entrenamiento
  description: >
    API v1 para la prescripción del entrenamiento de fuerza, catálogo de ejercicios
    con animaciones y videos de YouTube, plantillas reutilizables, trazabilidad
    de 1RM (testeado, reportado o estimado), trabajos sin pesas (por tiempo o distancia)
    y resolución determinística de cargas en kg redondeadas a 2.5 kg.
  version: 1.2.0
servers:
  - url: http://localhost:8083
    description: Entorno local / Docker Compose
  - url: http://entrenamiento:8080
    description: Red interna de Docker entre microservicios

security:
  - BearerAuth: []

tags:
  - name: Exercises
    description: Catálogo general de ejercicios con videos, animaciones y grupos musculares
  - name: Records
    description: Seguimiento de marcas máximas (1RM) con trazabilidad formal de origen
  - name: Routines and Templates
    description: Planificación estructurada, plantillas reutilizables y trabajos por tiempo/distancia
  - name: Execution and Loads
    description: Rutina del día con peso resuelto y registro de ejecuciones con recálculo Epley
  - name: Health
    description: Monitoreo de disponibilidad del servicio y base de datos

paths:
  /api/v1/exercises:
    get:
      tags:
        - Exercises
      summary: Buscar y listar ejercicios del catálogo
      description: >
        Devuelve el catálogo de ejercicios con búsqueda por similitud trigram (pg_trgm), filtros facetados
        por grupo muscular y equipamiento, y paginación para la biblioteca interactiva del frontend.
      operationId: listExercises
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Búsqueda por texto libre en el nombre o descripción del ejercicio.
        - name: muscleGroup
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por grupo muscular principal (ej. Piernas, Pecho, Espalda, Core).
        - name: muscle
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por músculo puntual en español (ej. Isquiotibiales, Cuádriceps, Glúteos, Pecho).
        - name: equipment
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por equipamiento requerido (ej. Barra Olímpica, Mancuerna, Máquina).
        - name: usedByPf
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Si es true, filtra únicamente los ejercicios utilizados por el PF en sus planificaciones o con récords (1RM) cargados.
        - name: ids
          in: query
          required: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
          style: form
          explode: true
          description: >
            Ejercicios puntuales por id (`?ids=a&ids=b`, hasta 100), por ejemplo para que el Asistente verifique
            que los ejercicios de un borrador existen en el catálogo (KAN-414). Si viene, se ignoran los demás filtros.
        - name: groupVariants
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Si es true, devuelve solo los ejercicios base, cada uno con sus variantes en `variants` (KAN-554).
            Un ejercicio base aparece si él o alguna de sus variantes cumple los filtros. Si es false, la lista
            es plana: base y variantes como ejercicios sueltos, cada variante con `parentExerciseId` y `variantLabel`.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número de página para paginación de resultados.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Cantidad de ejercicios por página.
      responses:
        "200":
          description: Catálogo de ejercicios paginado obtenido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExerciseResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Exercises
      summary: Crear ejercicio personalizado o propuesto por la IA
      description: Permite al preparador físico agregar un ejercicio a su catálogo privado. Requiere rol PreparadorFisico.
      operationId: createExercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExerciseRequest'
      responses:
        "201":
          description: Ejercicio creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: Ya existe un ejercicio con ese nombre para este preparador físico o en el catálogo global.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Identificador del ejercicio existente.
                    example: "b501d51c-4b53-4dc9-985f-8646f9037cfa"

  /api/v1/exercises/restrictions/check:
    post:
      tags:
        - Exercises
      summary: Chequear restricciones de una lista de ejercicios por zonas de dolor
      description: >
        Evalúa una lista de ejercicios contra las zonas de dolor reportadas (formato "zona:nivel").
        Devuelve por cada ejercicio si está restringido y, en su caso, la zona, nivel de dolor,
        motivo y lista ordenada de sustitutos biomecánicos.
      operationId: checkExerciseRestrictions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckExerciseRestrictionsRequest'
      responses:
        "200":
          description: Chequeo de restricciones realizado exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseRestrictionCheckResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/exercises/{id}/substitutes:
    get:
      tags:
        - Exercises
      summary: Obtener ejercicios sustitutos para una zona de dolor
      description: Devuelve la lista ordenada de ejercicios sustitutos recomendados para un ejercicio y una zona anatómica de dolor específica.
      operationId: getExerciseSubstitutes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único del ejercicio restringido.
        - name: zone
          in: query
          required: true
          schema:
            type: string
          description: Zona anatómica de dolor (ej. cuadriceps, espalda_baja).
          example: "cuadriceps"
      responses:
        "200":
          description: Lista ordenada de sustitutos obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseSubstitute'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/records:
    get:
      tags:
        - Records
      summary: Obtener récords 1RM de un atleta
      description: Lista las marcas máximas de fuerza del atleta, indicando su origen de trazabilidad (testeado, reportado o estimado).
      operationId: getAthleteRecords
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: currentOnly
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Filtrar solo marcas vigentes activas.
      responses:
        "200":
          description: Lista de récords personales obtenida con éxito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Record'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Records
      summary: Registrar o actualizar récord 1RM
      description: Asigna una nueva marca máxima a un ejercicio con su origen de verificación.
      operationId: saveRecord
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRecordRequest'
      responses:
        "200":
          description: Récord guardado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/records/reliability:
    get:
      tags:
        - Records
      summary: Resumen de confiabilidad de los récords de una categoría
      description: >
        Devuelve, por grupo de confiabilidad, la cantidad, el porcentaje y la lista de
        atletas de la categoría. Los grupos salen del origen del récord vigente más
        confiable de cada atleta (Testeado, Reportado, Estimado, Sin dato). Un récord
        con origen Epley cuenta como Testeado. Opcionalmente se puede filtrar por un
        solo ejercicio con exerciseId.
      operationId: getRecordsReliability
      parameters:
        - name: categoryId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de la categoría.
        - name: exerciseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtrar la confiabilidad a un solo ejercicio.
      responses:
        "200":
          description: Resumen de confiabilidad obtenido con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReliabilitySummary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/me/onboarding:
    post:
      tags:
        - Records
      summary: Onboarding inicial de marcas físicas del atleta
      description: Permite al atleta declarar sus antecedentes de fuerza durante la bienvenida. Cada marca se registra con origen estimado.
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OnboardingRecordRequest'
      responses:
        "201":
          description: Marcas registradas exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Record'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/record-proposals:
    get:
      tags:
        - Records
      summary: Listar propuestas de récord
      description: >
        Devuelve las propuestas de récord de Epley de los atletas del PF autenticado (filtro por pf_id),
        con el atleta, el ejercicio, el récord vigente, el propuesto, la serie que lo originó y la fecha.
      operationId: listRecordProposals
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Approved, Discarded]
            default: Pending
          description: Filtrar por estado de la propuesta. Por defecto Pending.
      responses:
        "200":
          description: Lista de propuestas de récord obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordProposal'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/record-proposals/{id}/approve:
    post:
      tags:
        - Records
      summary: Aprobar propuesta de récord Epley
      description: >
        Desactiva el récord vigente del atleta y crea uno nuevo con el peso propuesto y origen Epley.
        Si el récord vigente cambió desde que se creó la propuesta, o si la propuesta ya no está pendiente, responde 409.
      operationId: approveRecordProposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único de la propuesta de récord.
      responses:
        "200":
          description: Propuesta aprobada y récord actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/record-proposals/{id}/discard:
    post:
      tags:
        - Records
      summary: Descartar propuesta de récord Epley
      description: >
        Deja la propuesta en estado Discarded sin modificar el récord vigente.
        Aprobar o descartar una propuesta que ya no está pendiente responde 409.
      operationId: discardRecordProposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador único de la propuesta de récord.
      responses:
        "204":
          description: Propuesta descartada exitosamente.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/routines:
    post:
      tags:
        - Routines and Templates
      summary: Crear rutina de entrenamiento
      description: Asigna una planificación estructurada a una categoría o a un atleta individual, permitiendo ejercicios con carga o por tiempo/distancia.
      operationId: createRoutine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoutineRequest'
      responses:
        "201":
          description: Rutina creada con éxito.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - routineId
                properties:
                  message:
                    type: string
                    example: "Rutina creada y asignada exitosamente."
                  routineId:
                    type: string
                    format: uuid
                    example: "9a2f1b4c-3d5e-4f6a-b7c8-9d0e1f2a3b4c"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/routine-templates:
    get:
      tags:
        - Routines and Templates
      summary: Listar plantillas de rutinas del preparador físico
      description: Obtiene las planificaciones guardadas como plantillas maestras para reutilizar en otros grupos o temporadas.
      operationId: listRoutineTemplates
      responses:
        "200":
          description: Lista de plantillas recuperadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineTemplate'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Routines and Templates
      summary: Guardar una rutina como plantilla reutilizable
      description: Permite guardar una estructura de entrenamiento como plantilla maestra.
      operationId: createRoutineTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoutineTemplateRequest'
      responses:
        "201":
          description: Plantilla creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineTemplate'
        "400":
          $ref: '#/components/responses/BadRequest'

  /api/v1/routine-templates/{templateId}/apply:
    post:
      tags:
        - Routines and Templates
      summary: Aplicar plantilla a una categoría o atleta
      description: Clona y asigna la planificación de la plantilla a la categoría o deportista indicado.
      operationId: applyRoutineTemplate
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dayOfWeek
              properties:
                categoryId:
                  type: string
                  format: uuid
                  nullable: true
                  example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
                athleteId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Opcional si se aplica a toda una categoría.
                  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                dayOfWeek:
                  type: string
                  enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
                  example: "Monday"
      responses:
        "201":
          description: Rutina asignada desde la plantilla con éxito.
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/me/today-routine:
    get:
      tags:
        - Execution and Loads
      summary: Rutina de hoy del atleta autenticado con peso resuelto
      description: >
        Devuelve la planificación del día del atleta correspondiente a la cuenta autenticada,
        resolviendo su perfil en el microservicio de Estructura. Calcula la carga exacta a levantar
        en kg en base a su 1RM vigente y redondeada al múltiplo de 2.5 kg más cercano.
        Si no cuenta con una marca previa, prescribe la serie como de referencia (isReference: true).
        Si hoy es día de descanso o no tiene sesión programada, responde 200 con la lista de ejercicios vacía.
        Con `date` devuelve la rutina de otro día (calendario del atleta), con los récords vigentes de hoy.
      operationId: getMyTodayRoutine
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-10-23"
          description: Fecha de la rutina (hora Argentina, UTC-3). Si no se manda, se usa la de hoy.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayRoutineResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: La cuenta no tiene un perfil de atleta vinculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/me/today-routine/performed-sets:
    post:
      tags:
        - Execution and Loads
      summary: Registrar series ejecutadas de la rutina de hoy
      description: >
        Permite al atleta registrar lo levantado en su sesión de hoy (una entrada por ejercicio con su mejor serie).
        Calcula el 1RM estimado con la fórmula de Epley (1 a 10 repeticiones) y redondeo hacia abajo a múltiplo de 2.5 kg.
        Si la estimación supera el récord vigente, genera una propuesta de récord pendiente sin modificar el récord actual.
        Si algún ejercicio no pertenece a la rutina de hoy, responde 400.
      operationId: recordPerformedSets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PerformedSetInput'
      responses:
        "200":
          description: Series registradas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPerformedSetsResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/athletes/{athleteId}/today-routine:
    get:
      tags:
        - Execution and Loads
      summary: Rutina de hoy con el peso resuelto
      description: >
        Devuelve la planificación del día del atleta con el peso exacto a cargar en kg,
        resuelto en función de su récord 1RM vigente y redondeado al múltiplo de 2.5 kg más cercano.
        Si el atleta presenta lesiones activas o adaptaciones por dolor, incluye una advertencia.
      operationId: getTodayRoutine
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador del atleta
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-10-23"
          description: Fecha de la rutina (hora Argentina, UTC-3). Si no se manda, se usa la de hoy.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayRoutineResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: El atleta no existe o no es tuyo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/athletes/{athleteId}/executions:
    post:
      tags:
        - Execution and Loads
      summary: Registrar ejecución de ejercicio y recalcular 1RM (Fórmula Epley)
      description: >
        Registra el peso levantado y las repeticiones completadas por el atleta.
        Aplica la fórmula de Epley: `1RM_estimado = peso * (1 + repeticiones / 30)`.
        Si la estimación supera el récord vigente, actualiza automáticamente la marca del atleta.
      operationId: logExecution
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogExecutionRequest'
      responses:
        "200":
          description: Ejecución registrada y evaluación de récord completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogExecutionResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/training-plans:
    get:
      tags:
        - Routines and Templates
      summary: Listar planificaciones del preparador fisico
      description: Devuelve el listado resumido de planificaciones de entrenamiento del preparador fisico autenticado.
      operationId: listTrainingPlans
      responses:
        "200":
          description: Lista de planes obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingPlanSummary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Routines and Templates
      summary: Crear planificacion con arbol completo
      description: Crea una planificacion completa con sus semanas, sesiones y ejercicios prescritos. Requiere rol PreparadorFisico.
      operationId: createTrainingPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTrainingPlanRequest'
      responses:
        "201":
          description: Plan creado exitosamente con sus identificadores generados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanDetail'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/training-plans/{id}:
    get:
      tags:
        - Routines and Templates
      summary: Obtener detalle completo de planificacion
      description: Devuelve la estructura jerarquica completa del plan (semanas, sesiones y ejercicios prescritos).
      operationId: getTrainingPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de la planificacion.
      responses:
        "200":
          description: Planificacion encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Routines and Templates
      summary: Actualizar planificacion
      description: Actualiza los datos de la planificacion y reconcilia in-place su arbol de semanas, sesiones y ejercicios prescritos, preservando los identificadores de los elementos existentes. Requiere rol PreparadorFisico.
      operationId: updateTrainingPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de la planificacion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTrainingPlanRequest'
      responses:
        "200":
          description: Planificacion actualizada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanDetail'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/training-plans/schedule:
    get:
      tags:
        - Routines and Templates
      summary: Agenda del PF para una fecha
      description: >
        Devuelve las sesiones que tocan en la fecha indicada en todas las asignaciones del PF
        (a categorías o a atletas), con la misma regla que la rutina del atleta: la semana sale de los
        días desde el inicio de la asignación y la sesión, del día de la semana. Requiere rol PreparadorFisico.
      operationId: getTrainingPlanSchedule
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-10-23"
          description: Fecha a consultar (hora Argentina, UTC-3).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledSession'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/training-plans/assignments:
    post:
      tags:
        - Routines and Templates
      summary: Asignar planificacion a categoria o atleta
      description: Registra una asignacion formal de planificacion a una categoria o atleta con su fecha de inicio. Requiere rol PreparadorFisico. Responde 404 si la planificacion, la categoria o el atleta no existen o son de otro PF.
      operationId: assignTrainingPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPlanRequest'
      responses:
        "201":
          description: Plan asignado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignPlanResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/training-sessions/{id}:
    get:
      tags:
        - Routines and Templates
      summary: Obtener sesion de entrenamiento
      description: Obtiene los detalles de una sesion de entrenamiento por su identificador. Requiere rol PreparadorFisico (el atleta ve su sesion del dia en /api/v1/me/today-routine).
      operationId: getTrainingSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de la sesion de entrenamiento.
      responses:
        "200":
          description: Sesion de entrenamiento encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/training-sessions/{id}/notes:
    put:
      tags:
        - Routines and Templates
      summary: Actualizar nota del preparador fisico en sesion
      description: Modifica la nota u observacion del preparador fisico para una sesion de entrenamiento. Requiere rol PreparadorFisico.
      operationId: updateTrainingSessionNotes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de la sesion de entrenamiento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCoachNotesRequest'
      responses:
        "204":
          description: Nota actualizada exitosamente.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /api/v1/internal/training-sessions/athletes-with-session:
    get:
      tags:
        - Routines and Templates
      summary: Obtener atletas con sesión programada para una fecha
      description: Endpoint interno para microservicios con rol Servicio (worker de recordatorios). Devuelve los IDs de los atletas que tienen sesión ese día.
      operationId: getScheduledAthletes
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-10-26"
          description: Fecha de la sesión a consultar (YYYY-MM-DD).
        - name: pfId
          in: query
          required: true
          schema:
            type: string
            format: uuid
            example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          description: Identificador del preparador físico para aislar datos.
      responses:
        "200":
          description: Lista de IDs de atletas con sesión programada.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/health:
    get:
      tags:
        - Health
      summary: Chequeo de salud del servicio
      security: []
      operationId: healthCheck
      responses:
        "200":
          description: Servicio saludable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Healthy"

  /api/v1/records/import/preview:
    post:
      tags:
        - Records
      summary: Vista previa de importación de récords desde CSV
      operationId: previewRecordsImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - athleteColumn
                - exerciseColumn
                - weightColumn
              properties:
                file:
                  type: string
                  format: binary
                athleteColumn:
                  type: string
                exerciseColumn:
                  type: string
                weightColumn:
                  type: string
                dateColumn:
                  type: string
                sourceColumn:
                  type: string
      responses:
        "200":
          description: Vista previa generada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportRecordPreviewRow'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/records/import/confirm:
    post:
      tags:
        - Records
      summary: Confirmar importación de récords
      operationId: confirmRecordsImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmImportRecordsRequest'
      responses:
        "200":
          description: Récords importados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Record'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadRequest:
      description: Solicitud con datos inválidos o reglas de negocio incumplidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Token de autenticación ausente o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Recurso o atleta no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: Acceso denegado (requiere rol PreparadorFisico).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ImportRecordPreviewRow:
      type: object
      properties:
        rowNumber:
          type: integer
        athleteName:
          type: string
        exerciseName:
          type: string
        weightText:
          type: string
        dateText:
          type: string
          nullable: true
        sourceText:
          type: string
          nullable: true
        status:
          type: string
          enum: [Ok, AthleteNotFound, ExerciseNotFound, ExerciseApproximate, InvalidWeight]
        message:
          type: string
        athleteId:
          type: string
          format: uuid
          nullable: true
        exerciseId:
          type: string
          format: uuid
          nullable: true
        matchedExerciseName:
          type: string
          nullable: true
          description: Nombre del ejercicio del catálogo con el que se resolvió la fila. En ExerciseApproximate es la coincidencia parcial sugerida.
        weightOneRepMaxKg:
          type: number
          format: double
          nullable: true
        achievedAt:
          type: string
          format: date-time
          nullable: true
        origin:
          type: string
          nullable: true

    ConfirmImportRecordRow:
      type: object
      required:
        - athleteId
        - exerciseId
        - weightOneRepMaxKg
      properties:
        athleteId:
          type: string
          format: uuid
        exerciseId:
          type: string
          format: uuid
        weightOneRepMaxKg:
          type: number
          format: double
        achievedAt:
          type: string
          format: date-time
          nullable: true
        origin:
          type: string
          nullable: true

    ConfirmImportRecordsRequest:
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ConfirmImportRecordRow'

    CheckExerciseRestrictionsRequest:
      type: object
      required:
        - exerciseIds
      properties:
        painZones:
          type: string
          nullable: true
          description: Zonas de dolor reportadas en el check-in (formato "zona:nivel" separadas por comas).
          example: "cuadriceps:2,espalda_baja:1"
        exerciseIds:
          type: array
          items:
            type: string
            format: uuid
          description: Lista de IDs de ejercicios a verificar.
          example: ["b501d51c-4b53-4dc9-985f-8646f9037cfa", "c8a14358-bf87-41a4-94e0-7ee429d7c679"]

    ExerciseSubstitute:
      type: object
      required:
        - exerciseId
        - name
      properties:
        exerciseId:
          type: string
          format: uuid
          description: Identificador del ejercicio sustituto.
          example: "7e3b97f0-2581-4ebc-b3b0-642cf38a0f02"
        name:
          type: string
          description: Nombre del ejercicio sustituto.
          example: "Prensa de piernas"

    ExerciseRestrictionCheckResult:
      type: object
      required:
        - exerciseId
        - restricted
        - substitutes
      properties:
        exerciseId:
          type: string
          format: uuid
          description: Identificador del ejercicio evaluado.
          example: "b501d51c-4b53-4dc9-985f-8646f9037cfa"
        restricted:
          type: boolean
          description: Indica si el ejercicio debe ser restringido/reemplazado por dolor.
          example: true
        zone:
          type: string
          nullable: true
          description: Zona de dolor que disparó la restricción.
          example: "cuadriceps"
        painLevel:
          type: integer
          nullable: true
          description: Nivel de dolor reportado para la zona (1 a 10).
          example: 2
        reason:
          type: string
          nullable: true
          description: Motivo biomecánico de la contraindicación.
          example: "Alta compresión femororrotuliana y tensión en el tendón rotuliano con sobrecarga axial."
        substitutes:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseSubstitute'
          description: Lista ordenada de ejercicios sustitutos recomendados.

    Exercise:
      type: object
      required:
        - id
        - name
        - muscleGroup
      properties:
        id:
          type: string
          format: uuid
          example: "b501d51c-4b53-4dc9-985f-8646f9037cfa"
        name:
          type: string
          example: "Sentadilla Trasera"
        muscleGroup:
          type: string
          example: "Piernas"
        primaryMuscles:
          type: array
          items:
            type: string
          description: Grupos musculares principales involucrados en la ejecución.
          example: ["Piernas", "Glúteos"]
        secondaryMuscles:
          type: array
          items:
            type: string
          description: Músculos secundarios o estabilizadores involucrados.
          example: ["Isquiotibiales", "Zona Lumbar"]
        description:
          type: string
          nullable: true
          example: "Sentadilla libre profunda con barra olímpica"
        equipment:
          type: string
          nullable: true
          description: Equipamiento requerido para ejecutar el ejercicio.
          example: "Barra Olímpica"
        videoUrl:
          type: string
          nullable: true
          description: Enlace al video explicativo de YouTube (reproducible embebido o externo).
          example: "https://www.youtube.com/watch?v=aclHkVaku9U"
        animationUrl:
          type: string
          nullable: true
          description: URL del GIF/animación técnica del movimiento.
          example: "https://cdn.protraining.app/exercises/squat.gif"
        images:
          type: array
          items:
            type: string
          description: URLs de las 2 fotografías técnicas del ejercicio (postura inicial y postura final).
          example:
            - "https://cdn.protraining.app/exercises/squat-0.jpg"
            - "https://cdn.protraining.app/exercises/squat-1.jpg"
        origin:
          type: string
          enum: [Catalog, Coach, Ai]
          description: Origen del ejercicio (Catálogo inicial, cargado por el PF o propuesto por la IA).
          example: "Ai"
        parentExerciseId:
          type: string
          format: uuid
          nullable: true
          description: Si el ejercicio es una variante, el id de su ejercicio base (KAN-554). Es null en los ejercicios base.
          example: null
        variantLabel:
          type: string
          nullable: true
          description: Qué distingue a la variante de su ejercicio base. Es null en los ejercicios base.
          example: "Agarre cerrado"
        variants:
          type: array
          nullable: true
          description: >
            Variantes del ejercicio base. Solo viene con `groupVariants=true`; si no, es null.
            Cada variante conserva su id: los récords (1RM) y las planificaciones apuntan a la variante exacta.
          items:
            $ref: '#/components/schemas/Exercise'

    CreateExerciseRequest:
      type: object
      required:
        - name
        - muscleGroup
      properties:
        name:
          type: string
          example: "Sentadilla búlgara con banda"
        muscleGroup:
          type: string
          example: "Piernas"
        primaryMuscles:
          type: array
          items:
            type: string
          example: ["Cuádriceps", "Glúteos"]
        secondaryMuscles:
          type: array
          items:
            type: string
          example: ["Isquiotibiales"]
        equipment:
          type: string
          nullable: true
          example: "Banda elástica"
        instructions:
          type: string
          nullable: true
          example: "Colocar el pie trasero en banco y banda bajo el pie delantero."
        origin:
          type: string
          enum: [Catalog, Coach, Ai]
          default: "Coach"
          example: "Ai"

    PaginatedExerciseResponse:
      type: object
      description: Respuesta paginada del catálogo de ejercicios.
      required:
        - items
        - page
        - pageSize
        - totalCount
        - totalPages
      properties:
        items:
          type: array
          description: Lista de ejercicios devueltos en la página solicitada.
          items:
            $ref: '#/components/schemas/Exercise'
        page:
          type: integer
          description: Número de página actual.
          example: 1
        pageSize:
          type: integer
          description: Cantidad de ejercicios por página.
          example: 20
        totalCount:
          type: integer
          description: Total de ejercicios coincidentes con los filtros aplicados.
          example: 120
        totalPages:
          type: integer
          description: Total de páginas disponibles según el tamaño de página.
          example: 6

    RecordProposal:
      type: object
      description: Propuesta de actualización de récord 1RM basada en recálculo Epley.
      required:
        - id
        - athleteId
        - athleteName
        - exerciseId
        - exerciseName
        - currentWeight
        - proposedWeight
        - performedWeight
        - performedReps
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "e6f491c7-7489-4b68-b765-a81e9f1a21e4"
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        athleteName:
          type: string
          example: "Lucas Giménez"
        exerciseId:
          type: string
          format: uuid
          example: "b501d51c-4b53-4dc9-985f-8646f9037cfa"
        exerciseName:
          type: string
          example: "Sentadilla Trasera"
        currentWeight:
          type: number
          format: double
          example: 100.0
        proposedWeight:
          type: number
          format: double
          example: 107.5
        performedWeight:
          type: number
          format: double
          example: 90.0
        performedReps:
          type: integer
          example: 5
        status:
          type: string
          enum: [Pending, Approved, Discarded]
          example: "Pending"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-22T14:30:00Z"

    Record:
      type: object
      description: Objeto compartido de Récord 1RM con trazabilidad.
      required:
        - id
        - athleteId
        - exerciseId
        - exerciseName
        - weightOneRepMaxKg
        - origin
        - achievedAt
        - isCurrent
      properties:
        id:
          type: string
          format: uuid
          example: "e6f491c7-7489-4b68-b765-a81e9f1a21e4"
        athleteId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        exerciseId:
          type: string
          format: uuid
          example: "b501d51c-4b53-4dc9-985f-8646f9037cfa"
        exerciseName:
          type: string
          example: "Sentadilla Trasera"
        weightOneRepMaxKg:
          type: number
          format: double
          example: 140.0
        origin:
          type: string
          enum: [TestedInSession, Reported, EstimatedEpley, Epley]
          example: "TestedInSession"
        achievedAt:
          type: string
          format: date-time
          example: "2026-10-01T15:30:00Z"
        isCurrent:
          type: boolean
          example: true

    RecordReliabilityAthlete:
      type: object
      required:
        - athleteId
        - name
      properties:
        athleteId:
          type: string
          format: uuid
        name:
          type: string

    RecordReliabilityGroup:
      type: object
      required:
        - group
        - count
        - percentage
        - athletes
      properties:
        group:
          type: string
          enum: [Tested, Reported, Estimated, NoData]
        count:
          type: integer
        percentage:
          type: number
          format: double
        athletes:
          type: array
          items:
            $ref: '#/components/schemas/RecordReliabilityAthlete'

    RecordReliabilitySummary:
      type: object
      required:
        - categoryId
        - totalAthletes
        - groups
      properties:
        categoryId:
          type: string
          format: uuid
        exerciseId:
          type: string
          format: uuid
          nullable: true
        totalAthletes:
          type: integer
        groups:
          type: array
          items:
            $ref: '#/components/schemas/RecordReliabilityGroup'

    OnboardingRecordRequest:
      type: object
      required:
        - exerciseId
        - weightOneRepMaxKg
      properties:
        exerciseId:
          type: string
          format: uuid
        weightOneRepMaxKg:
          type: number
          format: double
          minimum: 1
          maximum: 500

    SaveRecordRequest:
      type: object
      required:
        - exerciseId
        - weightOneRepMaxKg
        - origin
      properties:
        exerciseId:
          type: string
          format: uuid
          example: "b501d51c-4b53-4dc9-985f-8646f9037cfa"
        weightOneRepMaxKg:
          type: number
          format: double
          minimum: 1
          maximum: 500
          example: 142.5
        origin:
          type: string
          enum: [TestedInSession, Reported, EstimatedEpley, Epley]
          example: "TestedInSession"

    RoutineItemRequest:
      type: object
      required:
        - exerciseId
        - order
        - modality
      properties:
        exerciseId:
          type: string
          format: uuid
          example: "b501d51c-4b53-4dc9-985f-8646f9037cfa"
        modality:
          type: string
          enum: [PercentageWeight, TimeSeconds, DistanceMeters, FixedReps]
          default: PercentageWeight
          example: "PercentageWeight"
        sets:
          type: integer
          minimum: 1
          example: 4
        reps:
          type: integer
          minimum: 1
          example: 6
        percentage:
          type: number
          format: double
          minimum: 10
          maximum: 100
          description: Porcentaje del 1RM para calcular la carga (solo si modalidad es PercentageWeight).
          example: 80.0
        targetTimeSeconds:
          type: integer
          nullable: true
          description: Para trabajos por tiempo (ej. pasadas de 30 segundos).
          example: 30
        targetDistanceMeters:
          type: integer
          nullable: true
          description: Para trabajos de fondo o pasadas (ej. 1000m).
          example: 1000
        order:
          type: integer
          minimum: 1
          example: 1

    CreateRoutineRequest:
      type: object
      required:
        - title
        - dayOfWeek
        - items
      properties:
        title:
          type: string
          example: "Fuerza Máxima - Día 1"
        categoryId:
          type: string
          format: uuid
          nullable: true
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        athleteId:
          type: string
          format: uuid
          nullable: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        dayOfWeek:
          type: string
          enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
          example: "Monday"
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoutineItemRequest'

