openapi: 3.0.3
info:
  title: ProTraining - Modelos Compartidos (Shared Schemas)
  description: >
    Definición canónica de los objetos de negocio compartidos entre los 5 microservicios
    de ProTraining. Incorpora el alcance ampliado oficial: trazabilidad de récords,
    consentimiento de tutores para atletas menores, semáforo tricolor de seguimiento,
    calendario de partidos y control de hábitos y cargas.
  version: 1.1.0

paths: {}

components:
  schemas:
    # -------------------------------------------------------------------------
    # 1. ATLETA
    # -------------------------------------------------------------------------
    ConsentimientoTutor:
      type: object
      description: Registro de consentimiento parental obligatorio para atletas menores de 18 años.
      required:
        - tutorNombre
        - tutorEmail
        - tutorTelefono
        - habilitaPreparacionFisica
        - fechaConsentimiento
      properties:
        tutorNombre:
          type: string
          description: Nombre completo del padre, madre o tutor legal.
          example: "Roberto Fernández"
        tutorEmail:
          type: string
          format: email
          example: "roberto.fernandez@email.com"
        tutorTelefono:
          type: string
          example: "+54 11 4444-1234"
        habilitaPreparacionFisica:
          type: boolean
          description: Autorización para realizar las rutinas y entrenamientos físicos del club.
          example: true
        habilitaRecomendacionesHabitos:
          type: boolean
          description: Autorización opcional para recibir consejos generales de hábitos, descanso y alimentación.
          example: false
        fechaConsentimiento:
          type: string
          format: date-time
          example: "2026-03-01T14:00:00Z"

    Atleta:
      type: object
      description: Entidad central del atleta, gestionada principalmente por Estructura y consumida por los demás microservicios.
      required:
        - id
        - nombre
        - apellido
        - email
        - telefono
        - esMenorDeEdad
        - categorias
        - activo
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único universal del atleta.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        cuentaId:
          type: string
          format: uuid
          nullable: true
          description: Identificador de la cuenta de usuario en Identidad (si tiene acceso a la PWA).
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        nombre:
          type: string
          example: "Lucas"
        apellido:
          type: string
          example: "Fernández"
        nombreCompleto:
          type: string
          example: "Lucas Fernández"
        email:
          type: string
          format: email
          example: "lucas.fernandez@club.com"
        telefono:
          type: string
          example: "+54 11 5555-1234"
        esMenorDeEdad:
          type: boolean
          description: Indica si el atleta tiene menos de 18 años, requiriendo consentimiento de tutor.
          example: false
        consentimientoTutor:
          $ref: '#/components/schemas/ConsentimientoTutor'
        condicionesMedicas:
          type: string
          nullable: true
          description: Ficha médica, alergias o patologías preexistentes.
          example: "Sin antecedentes patológicos relevantes"
        contactoEmergencia:
          type: string
          nullable: true
          description: Nombre y teléfono ante urgencias médicas.
          example: "María Fernández (Madre) - +54 11 4444-9876"
        categorias:
          type: array
          description: Categorías o planteles a los que pertenece el deportista.
          items:
            type: string
          example: ["Primera División", "Juveniles M19"]
        lesionesActivasCount:
          type: integer
          description: Cantidad de lesiones en curso (Activa o En Recuperación).
          example: 0
        activo:
          type: boolean
          description: Estado administrativo del deportista en el club.
          example: true

    # -------------------------------------------------------------------------
    # 2. CATEGORÍA
    # -------------------------------------------------------------------------
    Categoria:
      type: object
      description: Categoría o división deportiva dentro de la estructura de un club.
      required:
        - id
        - organizacionId
        - nombre
        - atletasCount
      properties:
        id:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        organizacionId:
          type: string
          format: uuid
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        nombre:
          type: string
          example: "Primera División"
        descripcion:
          type: string
          nullable: true
          example: "Plantel superior de rugby"
        atletasCount:
          type: integer
          example: 32
        proximoPartido:
          $ref: '#/components/schemas/PartidoTemporada'

    PartidoTemporada:
      type: object
      description: Evento de competencia del calendario de temporada para una categoría.
      required:
        - id
        - categoriaId
        - rival
        - fecha
        - condicion
      properties:
        id:
          type: string
          format: uuid
          example: "f1a2b3c4-d5e6-7f8a-9b0c-1d2e3f4a5b6c"
        categoriaId:
          type: string
          format: uuid
          example: "d3b07384-d113-4ec4-9844-3c8b4df56844"
        rival:
          type: string
          example: "Club San Martín"
        fecha:
          type: string
          format: date-time
          example: "2026-10-17T15:30:00Z"
        condicion:
          type: string
          enum: [Local, Visitante, Neutral]
          example: "Local"
        observaciones:
          type: string
          nullable: true
          example: "Fecha 8 del torneo oficial"

    # -------------------------------------------------------------------------
    # 3. RÉCORD (1RM)
    # -------------------------------------------------------------------------
    Record:
      type: object
      description: Registro de peso máximo levantado (1RM) con trazabilidad de origen.
      required:
        - id
        - atletaId
        - ejercicioId
        - ejercicioNombre
        - peso1RmKg
        - origen
        - fechaAlcanzado
        - esVigente
      properties:
        id:
          type: string
          format: uuid
          example: "e6f491c7-7489-4b68-b765-a81e9f1a21e4"
        atletaId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        ejercicioId:
          type: string
          format: uuid
          example: "b501d51c-4b53-4dc9-985f-8646f9037cfa"
        ejercicioNombre:
          type: string
          example: "Sentadilla Trasera"
        peso1RmKg:
          type: number
          format: double
          description: Peso de 1RM en kg.
          example: 140.0
        origen:
          type: string
          enum: [TesteadoEnSesion, Reportado, EstimadoEpley]
          description: Trazabilidad de la procedencia del récord (requisito del negocio).
          example: "TesteadoEnSesion"
        fechaAlcanzado:
          type: string
          format: date-time
          example: "2026-10-01T15:30:00Z"
        esVigente:
          type: boolean
          description: True si es la marca activa utilizada para dosificar las cargas.
          example: true

    # -------------------------------------------------------------------------
    # 4. SESIÓN
    # -------------------------------------------------------------------------
    Sesion:
      type: object
      description: Contexto de sesión retornado tras autenticación (Login / Registro).
      required:
        - token
        - tipoToken
        - cuentaId
        - nombreCompleto
        - email
        - rol
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tipoToken:
          type: string
          example: "Bearer"
        expiraEn:
          type: integer
          example: 86400
        cuentaId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
        nombreCompleto:
          type: string
          example: "Prof. Julián Antúnez"
        email:
          type: string
          format: email
          example: "julian@protraining.com"
        rol:
          type: string
          enum: [PF, Atleta]
          example: "PF"
        atletaId:
          type: string
          format: uuid
          nullable: true
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    # -------------------------------------------------------------------------
    # 5. CHECK-IN (BIENESTAR DIARIO Y SEMÁFORO)
    # -------------------------------------------------------------------------
    CheckIn:
      type: object
      description: Reporte diario completado en <30s que alimenta el semáforo tricolor del preparador físico.
      required:
        - id
        - atletaId
        - fecha
        - colorSemaforo
        - nivelEsfuerzo
        - horasSueno
        - dolorMuscular
        - nivelFatiga
        - estadoAnimo
        - nivelEstres
        - estaEnfermo
      properties:
        id:
          type: string
          format: uuid
          example: "6c24fcf8-0fb5-48b2-b01f-0e4c67eb2581"
        atletaId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        fecha:
          type: string
          format: date
          example: "2026-10-10"
        colorSemaforo:
          type: string
          enum: [Verde, Amarillo, Rojo]
          description: Clasificación de bienestar del atleta (Verde = normal, Amarillo = alerta/molestia, Rojo = intervención obligatoria).
          example: "Verde"
        motivoSemaforo:
          type: string
          nullable: true
          description: Justificación resumida si el semáforo está en Amarillo o Rojo.
          example: "Sin alertas de sobrecarga"
        nivelEsfuerzo:
          type: integer
          minimum: 1
          maximum: 10
          description: RPE de la sesión anterior (1 a 10).
          example: 7
        horasSueno:
          type: number
          format: double
          minimum: 0
          maximum: 24
          example: 7.5
        calidadSueno:
          type: integer
          minimum: 1
          maximum: 5
          description: Escala de descanso subjetivo de 1 a 5.
          example: 4
        dolorMuscular:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel de molestia muscular/articular localizada (1 = sin dolor, 5 = dolor agudo).
          example: 1
        nivelFatiga:
          type: integer
          minimum: 1
          maximum: 5
          description: Fatiga general acumulada de 1 a 5.
          example: 2
        estadoAnimo:
          type: integer
          minimum: 1
          maximum: 5
          description: Predisposición anímica y motivación de 1 a 5.
          example: 4
        nivelEstres:
          type: integer
          minimum: 1
          maximum: 5
          description: Nivel de estrés extradeportivo percibido de 1 a 5.
          example: 2
        estaEnfermo:
          type: boolean
          description: Indica si el atleta cursa algún cuadro viral, gripal o gastrointestinal.
          example: false
        zonasDolor:
          type: string
          nullable: true
          description: Zonas anatómicas seleccionadas en el mapa corporal si hay dolor.
          example: "Isquiotibial derecho"

    # -------------------------------------------------------------------------
    # ESQUEMA ESTÁNDAR DE ERROR (RFC 7807 - ProblemDetails)
    # -------------------------------------------------------------------------
    ProblemDetails:
      type: object
      description: Estructura estándar RFC 7807 para representación de errores en formato JSON.
      required:
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: "https://tools.ietf.org/html/rfc9110#section-15.5.5"
        title:
          type: string
          example: "No encontrado"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "El atleta especificado no existe o no pertenece a su club."
        instance:
          type: string
          example: "/api/v1/atletas/3fa85f64-5717-4562-b3fc-2c963f66afa6/rutina-hoy"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            peso1RmKg: ["El récord 1RM debe estar entre 0 y 500 kg."]
