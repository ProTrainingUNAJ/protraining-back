name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Si llega un push nuevo a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build y test (${{ matrix.nombre }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: identidad, carpeta: services/identidad, proyecto: services/identidad/API/API.csproj }
          - { nombre: estructura, carpeta: services/estructura, proyecto: services/estructura/API/API.csproj }
          - { nombre: entrenamiento, carpeta: services/entrenamiento, proyecto: services/entrenamiento/API/API.csproj }
          - { nombre: seguimiento, carpeta: services/seguimiento, proyecto: services/seguimiento/API/API.csproj }
          - { nombre: asistente, carpeta: services/asistente, proyecto: services/asistente/API/API.csproj }
          - { nombre: gateway, carpeta: gateway, proyecto: gateway/Gateway.csproj }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # El SDK de .NET 8 no lee .slnx: se compila el proyecto directo.
      - name: Restore
        run: dotnet restore ${{ matrix.proyecto }}

      - name: Build
        run: dotnet build ${{ matrix.proyecto }} --no-restore -c Release

      # Corre los proyectos de tests de la carpeta (los que terminan en Tests.csproj), si hay.
      - name: Test
        run: |
          tests=$(find ${{ matrix.carpeta }} -name '*Tests.csproj')
          if [ -z "$tests" ]; then
            echo "${{ matrix.nombre }} todavía no tiene proyectos de tests."
            exit 0
          fi
          for project in $tests; do
            dotnet test "$project" -c Release
          done

  smoke:
    name: Smoke test (docker compose)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar los servicios y sus bases
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180

      - name: Chequear /health de cada servicio y del gateway
        run: |
          for port in 8081 8082 8083 8084 8085 8000; do
            echo "Puerto $port: $(curl -fsS http://localhost:$port/health)"
          done

      - name: Chequear que el gateway llegue a cada servicio
        run: |
          for servicio in identidad estructura entrenamiento seguimiento asistente; do
            echo "Gateway -> $servicio: $(curl -fsS http://localhost:8000/$servicio/health)"
          done

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Bajar todo
        if: always()
        run: docker compose down -v

  contracts:
    name: Validar contratos OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar especificaciones con Redocly
        run: |
          npx --yes @redocly/cli lint contracts/*.yaml

  # Un único check para marcar como obligatorio en las reglas de la rama.
  ci-ok:
    name: CI ok
    if: always()
    needs: [build, smoke, contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que todo pasó
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.smoke.result }}" != "success" ] || [ "${{ needs.contracts.result }}" != "success" ]; then
            echo "Falló build (${{ needs.build.result }}), smoke (${{ needs.smoke.result }}) o contracts (${{ needs.contracts.result }})."
            exit 1
          fi

